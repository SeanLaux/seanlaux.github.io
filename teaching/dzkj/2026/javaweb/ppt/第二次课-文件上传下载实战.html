            <% for (int i = 0; i < list.size(); i++) {
                FileMeta f = list.get(i);
                String ext = f.getOriginalName().contains(".") ?
                    f.getOriginalName().substring(f.getOriginalName().lastIndexOf('.')+1).toLowerCase() : "";
                String icon = "📄";
                if ("jpg".equals(ext)||"png".equals(ext)||"gif".equals(ext)) icon = "🖼️";
                else if ("pdf".equals(ext)) icon = "📕";
                else if ("doc".equals(ext)||"docx".equals(ext)) icon = "📘";
                else if ("xls".equals(ext)||"xlsx".equals(ext)) icon = "📗";
                else if ("ppt".equals(ext)||"pptx".equals(ext)) icon = "📙";
                else if ("zip".equals(ext)||"rar".equals(ext)) icon = "🗜️";
                else if ("java".equals(ext)) icon = "☕";
            %>
            <tr>
                <td><%= i+1 %></td>
                <td><span class="file-icon"><%= icon %></span><%= f.getOriginalName() %></td>
                <td><%= f.getSizeText() %></td>
                <td><%= f.getUploadTime() %></td>
                <td><%= f.getUploader() %></td>
                <td style="text-align:center;">
                    <a class="btn-op btn-dl" href="download?id=<%= f.getId() %>">⬇ 下载</a>
                    <a class="btn-op btn-del" href="delete?id=<%= f.getId() %>" onclick="return confirm('确认删除该作业？')">🗑 删除</a>
                </td>
            </tr>
            <% } %>
        </table>
        <% } %>

        <div class="tip">
            💡 所有作业文件保存在服务器 WEB-INF/upload 目录，无法通过浏览器直接访问URL下载，必须通过下载接口读取流输出（更安全，避免文件盗链）。
        </div>
    </div>
</div>

</body>
</html>
</script>

<script type="text/plain" id="src-download-servlet">
package com.example.homework;

import com.example.homework.entity.FileMeta;
import jakarta.servlet.ServletException;
import jakarta.servlet.ServletOutputStream;
// ServletOutputStream：响应字节输出流，用于把文件二进制内容写给客户端
import jakarta.servlet.annotation.WebServlet;
import jakarta.servlet.http.HttpServlet;
import jakarta.servlet.http.HttpServletRequest;
import jakarta.servlet.http.HttpServletResponse;

import java.io.File;
import java.io.FileInputStream;
import java.io.IOException;
import java.net.URLEncoder;
// URLEncoder：对中文文件名做URL编码，否则Content-Disposition头中中文乱码
import java.util.List;

/**
 * 文件下载Servlet：根据文件ID读取文件，通过响应流写回客户端
 * URL: /download?id=xxx
 */
@WebServlet("/download")
public class DownloadServlet extends HttpServlet {

    @Override
    @SuppressWarnings("unchecked")
    protected void doGet(HttpServletRequest req, HttpServletResponse resp)
            throws ServletException, IOException {
        // 文件下载一律用GET（浏览器直接点链接/地址栏访问）

        String id = req.getParameter("id");
        // 根据ID查文件（不是直接用文件名！防止路径遍历攻击，用户传入../xxx可跳目录下载任意文件）

        List<FileMeta> fileList = (List<FileMeta>) getServletContext().getAttribute("fileList");
        FileMeta target = null;
        if (fileList != null) {
            for (FileMeta meta : fileList) {
                if (meta.getId().equals(id)) {
                    target = meta;
                    break;
                }
            }
        }

        if (target == null) {
            resp.sendError(HttpServletResponse.SC_NOT_FOUND, "文件不存在或已被删除");
            return;
        }

        File file = new File(target.getSavePath());
        if (!file.exists() || !file.isFile()) {
            resp.sendError(HttpServletResponse.SC_NOT_FOUND, "文件已从服务器删除");
            return;
        }

        // ======== 知识点：设置响应头告诉浏览器这是文件下载 ========
        // 知识点：Content-Type 响应头设置
        resp.setContentType(target.getContentType() != null ? target.getContentType() : "application/octet-stream");
        // application/octet-stream：通用二进制流，浏览器不知道是什么类型就会弹出下载框
        // 如果是image/png浏览器可能直接显示，想强制下载用application/octet-stream

        // 知识点：Content-Disposition 响应头（最关键）
        // attachment;filename=xxx：告诉浏览器以附件方式下载，并指定下载对话框的文件名
        String encodedName = URLEncoder.encode(target.getOriginalName(), "UTF-8").replace("+", "%20");
        // URLEncoder.encode：对中文文件名URL编码；空格替换为%20（RFC规范）
        resp.setHeader("Content-Disposition",
                "attachment; filename=\"" + encodedName + "\"; filename*=UTF-8''" + encodedName);
        // filename 用于兼容老浏览器；filename*=UTF-8'' 是RFC 5987标准，支持非ASCII文件名（现代浏览器优先）

        // 知识点：Content-Length 响应头告诉浏览器文件大小（便于显示下载进度）
        resp.setContentLengthLong(file.length());

        // ======== 以流方式把文件内容写到响应体 ========
        // 知识点：response.getOutputStream() 获取字节输出流（写二进制文件必须用字节流，不能用字符流getWriter）
        try (FileInputStream fis = new FileInputStream(file);
             ServletOutputStream os = resp.getOutputStream()) {
            // try-with-resources：自动关闭流（Java 7+），无需手动finally close

            byte[] buffer = new byte[8192];
            // 8KB缓冲区：每次读8KB写8KB，避免一次读大文件内存溢出
            int len;
            while ((len = fis.read(buffer)) != -1) {
                os.write(buffer, 0, len);
                // read(buffer)：读最多buffer.length字节到buffer，返回实际读取字节数；-1表示读完
                // write(buffer, 0, len)：写入实际读取的len字节（最后一次可能不足8KB）
            }
            os.flush();
            // flush：把缓冲区内容强制刷给客户端
        }
        // try-with-resources自动关闭fis和os，无需手动close

        // 注意：文件下载后不要再调用 forward/sendRedirect，响应已经写回
    }
}
</script>

<script type="text/plain" id="src-delete-servlet">
package com.example.homework;

import com.example.homework.entity.FileMeta;
import jakarta.servlet.ServletException;
import jakarta.servlet.annotation.WebServlet;
import jakarta.servlet.http.HttpServlet;
import jakarta.servlet.http.HttpServletRequest;
import jakarta.servlet.http.HttpServletResponse;

import java.io.File;
import java.io.IOException;
import java.util.Iterator;
import java.util.List;

/**
 * 删除文件Servlet：根据id删除服务器文件和列表记录
 * URL: /delete?id=xxx
 */
@WebServlet("/delete")
public class DeleteServlet extends HttpServlet {

    @Override
    @SuppressWarnings("unchecked")
    protected void doGet(HttpServletRequest req, HttpServletResponse resp)
            throws ServletException, IOException {
        String id = req.getParameter("id");

        List<FileMeta> fileList = (List<FileMeta>) getServletContext().getAttribute("fileList");
        if (fileList != null) {
            Iterator<FileMeta> it = fileList.iterator();
            while (it.hasNext()) {
                FileMeta meta = it.next();
                if (meta.getId().equals(id)) {
                    // 删除服务器物理文件
                    File file = new File(meta.getSavePath());
                    if (file.exists()) file.delete();
                    // 从列表中移除记录
                    it.remove();
                    break;
                }
            }
        }
        // 删除后重定向回列表
        resp.sendRedirect(req.getContextPath() + "/list");
    }
}
</script>

<!-- ============ 知识点模板 ============ -->
<script type="text/html" id="kp-chain-dofilter">
<script type="text/html" id="kp-chain-dofilter">
<div class="kp-def"><b>FilterChain.doFilter(ServletRequest req, ServletResponse resp)</b> 是过滤器链的<b>放行指令</b>，作用是把请求交给<b>链上的下一个过滤器</b>，所有过滤器都放行后最终到达目标Servlet。它是Filter机制里最核心的一行代码。</div>

<h4 style="margin:12px 0 8px;">过滤器链执行顺序</h4>
<table>
<tr><th>执行顺序</th><th>触发位置</th><th>典型用途</th></tr>
<tr><td>① 过滤器1 前置</td><td>chain.doFilter 之前</td><td>编码设置、日志开始时间</td></tr>
<tr><td>② 过滤器2 前置</td><td>chain.doFilter 之前</td><td>登录校验、权限判断</td></tr>
<tr><td>③ ……</td><td>……</td><td>……</td></tr>
<tr><td>④ Servlet 执行</td><td>最后一个Filter的chain.doFilter</td><td>业务逻辑</td></tr>
<tr><td>⑤ 过滤器2 后置</td><td>chain.doFilter 之后</td><td>响应压缩、日志记耗时</td></tr>
<tr><td>⑥ 过滤器1 后置</td><td>chain.doFilter 之后</td><td>全局响应头处理</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>"放行"不等于返回</b>：chain.doFilter 是<b>方法调用</b>不是 return，调用后会"进入下一层"，等下层全部执行完后<b>再回到本行继续执行下面的代码</b>——这就是后置处理能工作的原因；</li>
  <li><b>参数必须传 req 和 resp</b>（传原对象，不能 new 新对象，除非使用包装器模式做 XSS/SQL 注入过滤）；</li>
  <li>如果前置处理中已经发现不合法（未登录、IP被封），<b>不要调用 chain.doFilter</b>，直接用 response.sendRedirect 或写错误信息返回即可——这是"拦截"的本质。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 记录请求耗时的经典写法（前后都用）</h4>
<pre class="code"><code>public void doFilter(ServletRequest req, ServletResponse resp, FilterChain chain)
        throws IOException, ServletException {
    long start = System.currentTimeMillis();       // 前置
    try {
        chain.doFilter(req, resp);                 // 放行
    } finally {
        long cost = System.currentTimeMillis() - start; // 后置（即使异常也要记）
        System.out.println("请求耗时：" + cost + "ms");
    }
}</code></pre>

<div class="kp-warn"><b>⚠️ 易错点：</b>
<ul style="margin:4px 0 0 16px;">
  <li><b>不放行 + 不写响应 = 白屏</b>：浏览器一直等服务器返回直到超时；</li>
  <li>在 chain.doFilter 之后再用 response 做 forward/sendRedirect 会抛 <code>IllegalStateException: 响应已提交</code>；</li>
  <li>chain.doFilter 后修改响应头可能无效（因为输出流已经写出），要加响应头必须写在前置。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-content-disposition">
<script type="text/html" id="kp-content-disposition">
<div class="kp-def"><b>Content-Disposition</b> 是HTTP响应头，告诉浏览器"把响应内容当作文件下载还是直接显示"，同时指定<b>下载时保存的文件名</b>。</div>
<h4 style="margin:12px 0 8px;">两种形式</h4>
<table>
<tr><th>值</th><th>浏览器行为</th></tr>
<tr><td><code>Content-Disposition: inline; filename="xxx.pdf"</code></td><td>尝试在浏览器内直接打开（图片/PDF）</td></tr>
<tr><td><code>Content-Disposition: attachment; filename="xxx.pdf"</code></td><td>弹出下载框，另存为 xxx.pdf</td></tr>
</table>
<pre class="code"><code>// 下载标准写法（中文文件名必须URL编码，否则各浏览器乱码）
String encName = URLEncoder.encode(fileName, "UTF-8").replace("+", "%20");
response.setHeader("Content-Disposition",
    "attachment; filename=\"" + encName + "\"; filename*=UTF-8''" + encName);
// filename*=UTF-8'' 是 RFC 5987 标准写法，现代浏览器优先用它识别中文文件名</code></pre>
<div class="kp-warn"><b>⚠️ 中文文件名必须编码：</b>URLEncoder.encode + 替换+为%20，并提供 filename* 双字段兼容IE/Chrome/Firefox。只写filename而不编码，下载下来的文件名会是乱码或下划线。</div>
</script>
</script>

<script type="text/html" id="kp-content-type">
<script type="text/html" id="kp-content-type">
<div class="kp-def"><b>response.setContentType(String type)</b> 设置响应的<b>MIME类型</b>，告诉浏览器"我返回的是什么类型的数据"。文件下载场景必须设置正确的MIME，否则浏览器可能把文件当网页/图片直接打开，或显示乱码。</div>
<h4 style="margin:12px 0 8px;">常见MIME类型</h4>
<table>
<tr><th>文件类型</th><th>MIME字符串</th></tr>
<tr><td>HTML网页</td><td><code>text/html;charset=UTF-8</code></td></tr>
<tr><td>普通文本</td><td><code>text/plain;charset=UTF-8</code></td></tr>
<tr><td>JSON数据</td><td><code>application/json;charset=UTF-8</code></td></tr>
<tr><td>PDF文件</td><td><code>application/pdf</code></td></tr>
<tr><td>Word(.docx)</td><td><code>application/vnd.openxmlformats-officedocument.wordprocessingml.document</code></td></tr>
<tr><td>图片JPG</td><td><code>image/jpeg</code></td></tr>
<tr><td>二进制/未知类型</td><td><code>application/octet-stream</code>（下载的通用选择）</td></tr>
</table>
<pre class="code"><code>// 下载时的万能设置：告诉浏览器这是二进制流，下载而不是打开
response.setContentType("application/octet-stream;charset=UTF-8");
// 让Tomcat根据扩展名自动识别MIME
String mime = getServletContext().getMimeType(fileName);
if (mime == null) mime = "application/octet-stream";
response.setContentType(mime);</code></pre>
<div class="kp-warn"><b>⚠️ ContentType 必须在 getOutputStream()/getWriter() 之前调用</b>，否则设置无效（响应已提交）。</div>
</script>
</script>

<script type="text/html" id="kp-doget">
<script type="text/html" id="kp-doget">
<div class="kp-def"><b>doGet</b> 在文件上传下载场景中用于：<b>文件列表展示、文件下载、删除</b>（删除建议用POST，但教学中GET更简单）。文件上传下载项目中 doGet 的职责是"读操作"，doPost 的职责是"写操作"，二者分离符合 RESTful 设计思想。</div>
<h4 style="margin:12px 0 8px;">本项目中 doGet / doPost 分工</h4>
<table>
<tr><th>Servlet</th><th>doGet</th><th>doPost</th></tr>
<tr><td>LoginServlet</td><td>显示登录表单页（forward到login.jsp）</td><td>处理登录校验</td></tr>
<tr><td>UploadServlet</td><td>显示上传表单页（forward到upload.jsp）</td><td>处理文件上传</td></tr>
<tr><td>ListServlet</td><td>查询文件列表并展示</td><td>—（不用）</td></tr>
<tr><td>DownloadServlet</td><td>处理文件下载（写二进制流）</td><td>—（不用）</td></tr>
<tr><td>DeleteServlet</td><td>删除文件（教学简化）</td><td>—（生产建议用POST）</td></tr>
</table>
<pre class="code"><code>// 下载用GET（链接直接点）
@WebServlet("/download")
public class DownloadServlet extends HttpServlet {
    protected void doGet(HttpServletRequest req, HttpServletResponse resp) ... {
        String fileName = req.getParameter("fileName");
        // 校验session → 构造路径 → 写流输出
    }
}
// 列表展示用GET
@WebServlet("/list")
public class ListServlet extends HttpServlet {
    protected void doGet(HttpServletRequest req, HttpServletResponse resp) ... {
        List&lt;FileMeta&gt; files = listUserFiles(currentUser);
        req.setAttribute("files", files);
        req.getRequestDispatcher("/list.jsp").forward(req, resp);
    }
}</code></pre>
<div class="kp-warn"><b>⚠️ 删除操作虽然GET简单，但生产环境建议用POST+CSRF Token</b>：防止GET被浏览器预加载、被搜索引擎爬虫误删、被跨站请求伪造。教学场景为简化用GET，但讲课时一定要说明这个安全风险。另外 doGet 里不能调用 getPart()，只有 doPost + multipart/form-data 才能解析上传文件。</div>
</script>
</script>

<script type="text/html" id="kp-dopost">
<script type="text/html" id="kp-dopost">
<div class="kp-def"><b>doPost</b>是处理POST请求的方法，文件上传<b>必须用POST</b>（GET有长度限制、也不支持multipart/form-data编码）。上传表单提交后进入该方法，通过 request.getPart() 获取文件项。</div>
<h4 style="margin:12px 0 8px;">POST 三种Content-Type</h4>
<table>
<tr><th>Content-Type</th><th>用途</th><th>取参方式</th></tr>
<tr><td><code>application/x-www-form-urlencoded</code></td><td>普通表单（默认）</td><td>getParameter 取字符串</td></tr>
<tr><td><code>multipart/form-data</code></td><td>文件上传（必须）</td><td>getPart / getParts 取 Part</td></tr>
<tr><td><code>application/json</code></td><td>AJAX发JSON</td><td>request.getReader() 读流再解析</td></tr>
</table>
<ul>
  <li>表单必须写 <code>enctype="multipart/form-data"</code> 才能上传文件，否则getPart()取不到；</li>
  <li>同时存在普通字段和文件字段：普通字段仍用 getParameter()，文件字段用 getPart()。</li>
</ul>
<pre class="code"><code>@Override
protected void doPost(HttpServletRequest req, HttpServletResponse resp) ... {
    req.setCharacterEncoding("UTF-8");  // 必须先设编码
    Part filePart = req.getPart("file"); // multipart字段用getPart
    String desc   = req.getParameter("desc"); // 普通字段仍用getParameter
    // 处理文件保存...
}</code></pre>
<div class="kp-warn"><b>⚠️ 为什么不能用GET上传？</b>GET参数在URL中，浏览器+服务器对URL长度有限制（通常2~8KB），大文件传不了；且URL会被日志记录、历史记录、Referer泄露，不安全。</div>
</script>
</script>

<script type="text/html" id="kp-file-delete">
<script type="text/html" id="kp-file-delete">
<div class="kp-def"><b>File.delete() / Files.deleteIfExists()</b> 用于删除服务器上的文件。文件管理功能（删除作业）必须做<b>权限双重校验</b>：用户只能删自己上传的文件，不能删别人的。</div>
<h4 style="margin:12px 0 8px;">删除安全要点</h4>
<table>
<tr><th>风险</th><th>说明</th><th>防御</th></tr>
<tr><td>路径穿越</td><td>传 <code>fileName=../../etc/passwd</code> 删系统文件</td><td>只取文件名部分，禁止..、/，并校验文件在预期目录内</td></tr>
<tr><td>越权删除</td><td>改URL参数删别人的作业</td><td>用session取用户名，拼用户子目录后再判断file.exists()</td></tr>
<tr><td>误删</td><td>GET请求被浏览器预加载/爬虫误删</td><td>删除用POST提交（或加二次确认）</td></tr>
</table>
<pre class="code"><code>String author = (String) request.getSession().getAttribute("loginUser");
String fileName = request.getParameter("fileName");
// 安全构造路径
File userDir = new File(uploadRoot, author);
File target  = new File(userDir, fileName).getCanonicalFile();
// 关键校验：文件必须在 userDir 内（防路径穿越）
if (!target.getPath().startsWith(userDir.getCanonicalPath())) {
    response.sendError(403, "非法路径"); return;
}
if (target.exists() && target.isFile()) {
    target.delete();
}
response.sendRedirect(request.getContextPath() + "/list");</code></pre>
<div class="kp-warn"><b>⚠️ 关键校验：</b><code>target.getPath().startsWith(userDir.getCanonicalPath())</code> 这一行是<b>防止路径穿越的核心</b>，必须用 <code>getCanonicalFile()</code> 解析完所有 <code>../</code> 后再校验，只看文件名不够（用户可能传 <code>%2e%2e/admin/secret.doc</code> 绕过简单判断）。</div>
</script>
</script>

<script type="text/html" id="kp-file-list">
<script type="text/html" id="kp-file-list">
<div class="kp-def"><b>File.listFiles()</b> 遍历用户子目录下所有文件，把每个文件包装成FileMeta对象存入List，传给JSP用<code>&lt;c:forEach&gt;</code>展示文件列表。Java NIO的 <code>Files.list()</code> 是更现代的流式API，但教学用经典File类更直观。</div>
<h4 style="margin:12px 0 8px;">文件遍历常用方法</h4>
<table>
<tr><th>方法</th><th>返回值</th><th>说明</th></tr>
<tr><td><code>file.list()</code></td><td>String[]</td><td>返回子文件/目录名字符串数组</td></tr>
<tr><td><code>file.listFiles()</code></td><td>File[]</td><td>返回子文件/目录File对象数组（最常用）</td></tr>
<tr><td><code>file.listFiles(filter)</code></td><td>File[]</td><td>带FilenameFilter/FileFilter过滤</td></tr>
<tr><td><code>Files.list(path)</code>（NIO.2）</td><td>Stream&lt;Path&gt;</td><td>JDK 8+流式API，支持filter/map/sort</td></tr>
</table>
<pre class="code"><code>// 列出当前用户所有文件（教学经典写法）
File userDir = new File(uploadRoot, author);
if (!userDir.exists()) userDir.mkdirs();
List&lt;FileMeta&gt; files = new ArrayList&lt;&gt;();
File[] fsArr = userDir.listFiles();
if (fsArr != null) {            // ⚠️ 目录不存在返回null，必须判断
    for (File f : fsArr) {
        if (f.isFile()) {       // 只取文件，排除子目录
            FileMeta meta = new FileMeta();
            meta.setName(f.getName());
            meta.setSize(f.length());
            meta.setUploadTime(new Date(f.lastModified()));
            files.add(meta);
        }
    }
}
// 按上传时间倒序（最新的在前）
files.sort((a,b) -&gt; Long.compare(b.getUploadTime().getTime(),
                                  a.getUploadTime().getTime()));
req.setAttribute("files", files);
req.getRequestDispatcher("/list.jsp").forward(req, resp);</code></pre>
<div class="kp-warn"><b>⚠️ listFiles() 的null问题：</b>目录不存在、路径是文件、无读权限时返回 <b>null</b>（不是空数组！），直接for循环会抛 NullPointerException，必须先判断。这是File API的经典坑。</div>
</script>
</script>

<script type="text/html" id="kp-file-meta">
<script type="text/html" id="kp-file-meta">
<div class="kp-def"><b>FileMeta</b> 是封装<b>文件元信息</b>的Java实体类（POJO/DTO），把文件名、大小、上传时间、上传者等属性封装成一个对象，方便传值到JSP展示（比传一堆零散Map更规范）。</div>
<h4 style="margin:12px 0 8px;">典型字段</h4>
<table>
<tr><th>字段</th><th>类型</th><th>说明</th></tr>
<tr><td>name</td><td>String</td><td>保存后的UUID文件名（服务器上真实名字）</td></tr>
<tr><td>originalName</td><td>String</td><td>原始文件名（用户看到的）</td></tr>
<tr><td>size</td><td>long</td><td>文件字节数</td></tr>
<tr><td>uploadTime</td><td>LocalDateTime</td><td>上传时间</td></tr>
<tr><td>author</td><td>String</td><td>上传者用户名</td></tr>
<tr><td>contentType</td><td>String</td><td>MIME类型</td></tr>
</table>
<pre class="code"><code>public class FileMeta implements Serializable {
    private String name;
    private String originalName;
    private long size;
    private LocalDateTime uploadTime;
    private String author;
    private String contentType;
    // getter/setter ...
    // 显示用辅助方法
    public String getFormattedSize() {
        if (size &lt; 1024) return size + " B";
        if (size &lt; 1024*1024) return String.format("%.1f KB", size/1024.0);
        return String.format("%.1f MB", size/1024.0/1024.0);
    }
}</code></pre>
<div class="kp-warn"><b>💡 小技巧：</b>FileMeta务必实现 <code>Serializable</code> 接口，这样以后文件列表需要存到session或分布式缓存（Redis）时不会报 NotSerializableException。<code>getFormattedSize()</code> 这种辅助方法让JSP不用写格式化代码，直接 <code>${file.formattedSize}</code> 调用。</div>
</script>
</script>

<script type="text/html" id="kp-file-upload-security">
<script type="text/html" id="kp-file-upload-security">
<div class="kp-def"><b>文件上传安全校验</b> 是企业开发必须做的防护。初学者最容易忽略——"让用户能上传任何文件"意味着服务器可以被上传jsp木马，直接getshell入侵。</div>
<h4 style="margin:12px 0 8px;">必须做的5项校验</h4>
<table>
<tr><th>校验项</th><th>危险</th><th>解决方式</th></tr>
<tr><td>文件类型白名单</td><td>上传.jsp/.war/.exe木马入侵</td><td>只允许 docx/pdf/png/jpg/zip/ppt 等安全扩展名，放在Set里判断</td></tr>
<tr><td>文件大小上限</td><td>传超大文件占满磁盘</td><td>@MultipartConfig.maxFileSize + 判断part.getSize()</td></tr>
<tr><td>文件名特殊字符</td><td>路径穿越 <code>../../etc/passwd</code></td><td>用UUID重命名，去掉..、/、\\、空格</td></tr>
<tr><td>存放目录在WEB-INF外且不被执行</td><td>上传jsp直接被Tomcat执行</td><td>存在服务器本地磁盘（如 /data/upload），或在web.xml配置该目录为静态资源不解析</td></tr>
<tr><td>用户权限隔离</td><td>上传到别人目录</td><td>按session用户名建子目录，目录名从session取（不能从参数取）</td></tr>
</table>
<pre class="code"><code>// 类型白名单校验
Set&lt;String&gt; allowExt = new HashSet&lt;&gt;(Arrays.asList(
    ".docx",".doc",".pdf",".zip",".rar",".ppt",".pptx",".txt",
    ".png",".jpg",".jpeg",".gif",".mp4"));
String ext = fileName.substring(fileName.lastIndexOf('.')).toLowerCase();
if (!allowExt.contains(ext)) {
    request.setAttribute("msg", "不允许上传此类型文件：" + ext);
    request.getRequestDispatcher("/upload.jsp").forward(request, response);
    return;
}
if (part.getSize() > 10 * 1024 * 1024) {
    request.setAttribute("msg", "文件不能超过10MB");
    return;
}</code></pre>
<div class="kp-warn"><b>⚠️ 安全红线：</b>绝对不要用前端JS做校验就够了（前端可被绕过）；<b>服务端白名单校验是最后一道防线、必须做</b>。另外文件名不要直接用用户上传的原始文件名，要用UUID重命名后再保存，防止路径穿越攻击。</div>
</script>
</script>

<script type="text/html" id="kp-filter">
<script type="text/html" id="kp-filter">
<div class="kp-def"><b>jakarta.servlet.Filter</b> 是过滤器的核心接口，用于在<b>请求到达Servlet之前、响应返回浏览器之前</b>做统一的预处理/后处理。典型用途：统一编码、登录校验、日志记录、敏感词过滤、跨域处理、XSS过滤、权限校验、压缩响应等"横切关注点"。</div>

<h4 style="margin:12px 0 8px;">Filter 三个生命周期方法</h4>
<table>
<tr><th>方法</th><th>调用时机</th><th>常用操作</th></tr>
<tr><td><code>init(FilterConfig config)</code></td><td>项目启动、过滤器被创建时调用<b>一次</b></td><td>读取初始化参数、初始化资源（连接池、线程池等）</td></tr>
<tr><td><code>doFilter(ServletRequest req, ServletResponse resp, FilterChain chain)</code></td><td><b>每次请求匹配路径都会调用</b>，核心方法</td><td>前置处理 → chain.doFilter放行 → 后置处理</td></tr>
<tr><td><code>destroy()</code></td><td>项目关闭/过滤器被销毁时调用一次</td><td>释放资源（关流、关连接）</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 工作流程图解</h4>
<pre class="code"><code>浏览器 → [过滤器1前置] → [过滤器2前置] → [Servlet处理业务]
         [过滤器1后置] ← [过滤器2后置] ← 返回响应</code></pre>
<ul>
  <li><b>chain.doFilter(req,resp) 是"放行"</b>：调用它才会继续执行下一个过滤器 → 最终到Servlet；不调用 = 请求被拦截，直接返回（典型场景：未登录跳到登录页）；</li>
  <li><b>doFilter 前后都可以写代码</b>：前面是"请求预处理"，chain.doFilter 之后是"响应后处理"，此时Servlet已经执行完，可以拿到响应数据做加工；</li>
  <li>ServletRequest/ServletResponse 是<b>通用协议无关</b>的父接口，实际HTTP场景必须强转成 <code>HttpServletRequest</code>/<code>HttpServletResponse</code> 才能用 getSession、getHeader 等方法。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 最简骨架</h4>
<pre class="code"><code>@WebFilter("/*")
public class XxxFilter implements Filter {
    public void init(FilterConfig config) {}
    public void doFilter(ServletRequest req, ServletResponse resp,
                         FilterChain chain) throws IOException, ServletException {
        HttpServletRequest  request  = (HttpServletRequest) req;
        HttpServletResponse response = (HttpServletResponse) resp;
        // ① 前置处理
        chain.doFilter(req, resp);   // ② 放行
        // ③ 后置处理
    }
    public void destroy() {}
}</code></pre>

<div class="kp-warn"><b>⚠️ 经典错误：</b>
<ul style="margin:4px 0 0 16px;">
  <li>忘记调用 <code>chain.doFilter()</code>：请求被"卡住"，浏览器一直白屏转圈；</li>
  <li>不放行也不写response响应：浏览器等到超时；</li>
  <li>doFilter里直接用 request.getSession() —— 没强转！必须先 <code>(HttpServletRequest)request</code>。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-forward">
<script type="text/html" id="kp-forward">
<div class="kp-def"><b>forward</b> 转发用于上传/登录失败需要回显错误信息时，把带着错误提示的request转给JSP展示。转发后地址栏不变（还停留在/upload），但显示的是upload.jsp页面。</div>
<h4 style="margin:12px 0 8px;">上传流程中的跳转选择</h4>
<table>
<tr><th>场景</th><th>跳转方式</th><th>原因</th></tr>
<tr><td>登录成功</td><td>sendRedirect("/upload")</td><td>写操作→PRG</td></tr>
<tr><td>登录失败</td><td>forward("/login.jsp")</td><td>需要回显errorMsg</td></tr>
<tr><td>上传成功</td><td>sendRedirect("/list")</td><td>写操作→PRG防重复上传</td></tr>
<tr><td>上传失败（类型/大小）</td><td>forward("/upload.jsp")</td><td>需要回显msg错误信息</td></tr>
<tr><td>列表查询</td><td>forward("/list.jsp")</td><td>读操作+传files数据</td></tr>
<tr><td>删除成功</td><td>sendRedirect("/list")</td><td>写操作→PRG</td></tr>
</table>
<pre class="code"><code>// 上传失败：存错误信息到request域，转发回表单页
if (extNotAllowed) {
    request.setAttribute("msg", "不允许上传此文件类型：" + ext);
    request.getRequestDispatcher("/upload.jsp").forward(request, response);
    return;
}
// upload.jsp 里显示错误：
// &lt;c:if test="\${not empty msg}"&gt;&lt;div class="err">\${msg}&lt;/div&gt;&lt;/c:if&gt;</code></pre>
<div class="kp-warn"><b>⚠️ 注意forward路径：</b>路径以 <code>/</code> 开头代表项目根，不用加项目名。forward()后务必 <code>return</code>，否则后续代码还会执行。</div>
</script>
</script>

<script type="text/html" id="kp-getparam">
<script type="text/html" id="kp-getparam">
<div class="kp-def"><b>request.getParameter(String name)</b> 在multipart/form-data场景下也能获取<b>普通文本字段</b>（type=text/hidden/radio的字段），用法与普通表单一致。</div>
<h4 style="margin:12px 0 8px;">上传表单的参数分类</h4>
<table>
<tr><th>字段类型</th><th>HTML写法</th><th>服务端获取</th></tr>
<tr><td>文本描述</td><td><code>&lt;input type="text" name="desc"&gt;</code></td><td><code>request.getParameter("desc")</code></td></tr>
<tr><td>提交人</td><td><code>&lt;input type="hidden" name="author" value="\${loginUser}"&gt;</code></td><td><code>getParameter("author")</code></td></tr>
<tr><td>文件</td><td><code>&lt;input type="file" name="file"&gt;</code></td><td><code>request.getPart("file")</code>（Part对象）</td></tr>
</table>
<pre class="code"><code>req.setCharacterEncoding("UTF-8");
String desc = req.getParameter("desc");  // 普通文本字段
Part file = req.getPart("file");         // 文件字段（Part对象）
if (desc != null && !desc.trim().isEmpty()) { ... }</code></pre>
<div class="kp-warn"><b>⚠️ 安全提示：</b>上传者用户名<b>不要从表单参数取</b>，必须从 <code>session.getAttribute("loginUser")</code> 取。否则用户用F12改表单就能冒充别人上传。</div>
</script>
</script>

<script type="text/html" id="kp-getpart">
<script type="text/html" id="kp-getpart">
<div class="kp-def"><b>request.getPart(String name)</b> 是 Servlet 3.0 原生上传API的核心方法，根据文件域name属性获取<b>单个Part对象</b>（代表一个上传文件）。多文件上传用 <code>getParts()</code> 获取全部。</div>
<h4 style="margin:12px 0 8px;">Part 接口常用方法</h4>
<table>
<tr><th>方法</th><th>返回值</th><th>用途</th></tr>
<tr><td><code>getSubmittedFileName()</code></td><td>String</td><td>获取上传时的<b>原始文件名</b>（含扩展名，如"作业.docx"）</td></tr>
<tr><td><code>getContentType()</code></td><td>String</td><td>获取文件MIME类型（如application/pdf）</td></tr>
<tr><td><code>getSize()</code></td><td>long</td><td>获取文件大小（字节）</td></tr>
<tr><td><code>getInputStream()</code></td><td>InputStream</td><td>获取文件内容输入流（手动存盘用）</td></tr>
<tr><td><code>write(String fileName)</code></td><td>void</td><td>便捷方法：直接把文件写入@MultipartConfig.location或相对路径</td></tr>
<tr><td><code>delete()</code></td><td>void</td><td>删除临时文件（一般不用手动调，容器自动清理）</td></tr>
<tr><td><code>getHeader(String name)</code></td><td>String</td><td>获取上传头信息（取文件名兼容用）</td></tr>
</table>
<pre class="code"><code>Part filePart = request.getPart("file");   // &lt;input type="file" name="file"&gt;
String fileName = filePart.getSubmittedFileName(); // 原文件名
long size       = filePart.getSize();              // 大小
String mime     = filePart.getContentType();       // 类型
// 保存到服务器
filePart.write(savePath + File.separator + fileName);</code></pre>
<div class="kp-warn"><b>⚠️ 浏览器兼容：</b>IE浏览器getSubmittedFileName()会返回完整路径 <code>"C:\Users\xxx\作业.docx"</code>，必须做切割：<code>fileName = fileName.substring(fileName.lastIndexOf("\\")+1);</code></div>
</script>
</script>

<script type="text/html" id="kp-multipart-config">
<script type="text/html" id="kp-multipart-config">
<div class="kp-def"><b>@MultipartConfig</b> 是Servlet 3.0+提供的<b>文件上传配置注解</b>，标注在Servlet类上才能开启multipart解析能力。不写的话容器不会解析上传流，request.getPart() 返回 null。</div>
<h4 style="margin:12px 0 8px;">4个核心属性</h4>
<table>
<tr><th>属性</th><th>类型</th><th>说明</th><th>推荐值（教学）</th></tr>
<tr><td><code>maxFileSize</code></td><td>long</td><td><b>单个文件</b>最大字节数，超过抛IllegalStateException（容器返回500）</td><td>10*1024*1024（10MB）</td></tr>
<tr><td><code>maxRequestSize</code></td><td>long</td><td><b>整个请求</b>最大字节数（所有文件+普通字段总和）</td><td>20*1024*1024（20MB）</td></tr>
<tr><td><code>fileSizeThreshold</code></td><td>int</td><td>文件大小阈值，超过就写入临时目录（内存→磁盘）</td><td>1024*1024（1MB）</td></tr>
<tr><td><code>location</code></td><td>String</td><td>临时文件存放目录（一般用容器默认）</td><td>""（默认）</td></tr>
</table>
<pre class="code"><code>@WebServlet("/upload")
@MultipartConfig(
    maxFileSize = 10 * 1024 * 1024,      // 单文件10MB
    maxRequestSize = 20 * 1024 * 1024,   // 总请求20MB
    fileSizeThreshold = 1024 * 1024      // 超过1MB写临时文件
)
public class UploadServlet extends HttpServlet { ... }</code></pre>
<div class="kp-warn"><b>⚠️ 注意单位是字节</b>！很多新手写成 maxFileSize=10 以为是10MB，其实是10字节直接报错。计算方式：<code>MB数 * 1024 * 1024</code>。</div>
</script>
</script>

<script type="text/html" id="kp-output-stream">
<script type="text/html" id="kp-output-stream">
<div class="kp-def"><b>response.getOutputStream()</b> 获取<b>二进制输出流</b>（ServletOutputStream），用于向浏览器输出字节数据（文件下载、图片、视频、PDF）。与之对应，输出文本用 <code>getWriter()</code>，二者<b>不能同时调用</b>。</div>
<h4 style="margin:12px 0 8px;">getOutputStream vs getWriter 对比</h4>
<table>
<tr><th>方法</th><th>返回类型</th><th>用途</th><th>自动编码</th></tr>
<tr><td><code>getOutputStream()</code></td><td>ServletOutputStream</td><td>输出二进制（文件、图片、视频）</td><td>❌ 原样输出字节</td></tr>
<tr><td><code>getWriter()</code></td><td>PrintWriter</td><td>输出文本（HTML/JSON/字符串）</td><td>✅ 按response字符编码转</td></tr>
</table>
<h4 style="margin:14px 0 8px;">🔑 文件下载标准模板（必背）</h4>
<pre class="code"><code>// ① 设置响应头（必须在getOutputStream之前）
response.setContentType("application/octet-stream;charset=UTF-8");
response.setHeader("Content-Disposition", "attachment; ...");
response.setContentLengthLong(file.length()); // 进度条准确

// ② try-with-resources 自动关流
try (InputStream in = new FileInputStream(file);
     OutputStream out = response.getOutputStream()) {
    // ③ 缓冲区循环读写（经典IO模板）
    byte[] buf = new byte[8192]; // 8KB
    int len;
    while ((len = in.read(buf)) != -1) { out.write(buf, 0, len); }
    out.flush();
}</code></pre>
<ul>
  <li><b>缓冲区8KB</b>是JDK BufferedInputStream默认值，平衡系统调用次数与内存占用；</li>
  <li><b>try-with-resources</b>自动关闭流，避免资源泄漏（JDK 7+特性）；</li>
  <li>手动 <code>out.close()</code> 可能与容器冲突，一般不调（try会自动关）。</li>
</ul>
<div class="kp-warn"><b>⚠️ 不能同时调用两个方法：</b>同一请求中调过getWriter()再getOutputStream()会抛 <code>IllegalStateException: getWriter() has already been called</code>，反之亦然。转发给的JSP里默认会用getWriter()，所以下载Servlet里不能forward到任何JSP。</div>
</script>
</script>

<script type="text/html" id="kp-part-write">
<script type="text/html" id="kp-part-write">
<div class="kp-def"><b>part.write(String path)</b> 是 Part 接口提供的<b>快捷保存方法</b>，直接把上传文件写入磁盘。path可以是相对路径（相对于@MultipartConfig的location）或绝对路径。</div>
<h4 style="margin:12px 0 8px;">write 方式 vs InputStream 手动复制</h4>
<table>
<tr><th>方式</th><th>优点</th><th>缺点</th></tr>
<tr><td><code>part.write(绝对路径)</code></td><td>代码最简，一行搞定</td><td>不能做大小限制、进度监控、类型校验后再保存</td></tr>
<tr><td><code>part.getInputStream() + Files.copy</code></td><td>灵活，可边读边校验、限流</td><td>代码多几行，要自己关流</td></tr>
</table>
<pre class="code"><code>// 方法1：write（推荐教学用，简洁）
File saveFile = new File(userDir, saveName);
part.write(saveFile.getAbsolutePath());

// 方法2：InputStream手动复制（灵活）
try (InputStream in = part.getInputStream();
     OutputStream out = new FileOutputStream(saveFile)) {
    byte[] buf = new byte[8192];
    int len;
    while ((len = in.read(buf)) != -1) { out.write(buf, 0, len); }
}</code></pre>
<div class="kp-warn"><b>⚠️ 路径必须是 File 对象的 getAbsolutePath()</b>，不要直接传字符串拼接的路径（Windows下\、Linux下/分隔符问题，用File.separator或File对象自动处理）。</div>
</script>
</script>

<script type="text/html" id="kp-sendredirect">
<script type="text/html" id="kp-sendredirect">
<div class="kp-def"><b>response.sendRedirect</b> 重定向在文件上传/删除场景的规范用法：<b>上传/删除完成后必须重定向到列表页</b>（PRG模式），防止用户按F5刷新导致重复上传/删除。</div>
<h4 style="margin:12px 0 8px;">PRG模式：Post-Redirect-Get</h4>
<table>
<tr><th>阶段</th><th>请求方式</th><th>处理内容</th></tr>
<tr><td>用户提交表单</td><td>POST /upload</td><td>保存文件到服务器（写操作）</td></tr>
<tr><td>服务器返回</td><td>302 Location:/list</td><td>告诉浏览器去访问/list</td></tr>
<tr><td>浏览器自动跳转</td><td>GET /list</td><td>查询文件列表展示（读操作）</td></tr>
</table>
<pre class="code"><code>// 上传成功：PRG重定向到列表页
response.sendRedirect(request.getContextPath() + "/list");
return; // 必须return，后面代码不再执行</code></pre>
<div class="kp-warn"><b>⚠️ 刷新后果：</b>如果上传后直接forward到list.jsp，用户按F5会重新提交POST请求 → 文件重复上传（出现多份UUID文件）。PRG后刷新只会刷新GET /list，幂等安全。</div>
</script>
</script>

<script type="text/html" id="kp-servletcontext-file">
<script type="text/html" id="kp-servletcontext-file">
<div class="kp-def"><b>ServletContext</b> 在文件上传场景下承担<b>全局共享配置</b>的角色：保存上传根目录路径、MIME类型识别、getRealPath获取真实路径、存全局fileList（教学用）。</div>
<h4 style="margin:12px 0 8px;">三大用途</h4>
<table>
<tr><th>方法</th><th>用途</th><th>调用方</th></tr>
<tr><td><code>setAttribute/getAttribute("uploadPath")</code></td><td>存上传根目录路径（Listener启动时写）</td><td>所有文件Servlet读</td></tr>
<tr><td><code>getMimeType(fileName)</code></td><td>根据文件名扩展名自动识别MIME类型</td><td>DownloadServlet设Content-Type</td></tr>
<tr><td><code>getRealPath("/upload")</code></td><td>获取Web应用内upload目录真实磁盘路径</td><td>UploadDirInitListener创建目录</td></tr>
</table>
<pre class="code"><code>// 上传/下载/删除/列表 Servlet 都这么拿上传目录：
String root = (String) getServletContext().getAttribute("uploadPath");
File uploadRoot = new File(root);
File userDir = new File(uploadRoot, author); // 当前用户的子目录

// MIME类型自动识别（比手动if判断更全）
String mime = getServletContext().getMimeType(fileName);
if (mime == null) mime = "application/octet-stream"; // 未知类型用通用二进制</code></pre>
<div class="kp-warn"><b>⚠️ getMimeType依据：</b>Tomcat 根据 <code>conf/web.xml</code> 里配置的MIME映射判断，比自己写if/else判断后缀更全面准确，企业开发推荐使用。</div>
</script>
</script>

<script type="text/html" id="kp-session">
<script type="text/html" id="kp-session">
<div class="kp-def"><b>HttpSession</b> 在文件上传下载场景中用于<b>识别当前登录用户、记录用户私有目录</b>、防止越权下载/删除他人文件。这是比URL参数传递用户身份<b>安全一万倍</b>的做法。</div>
<h4 style="margin:12px 0 8px;">Session在各环节的作用</h4>
<table>
<tr><th>环节</th><th>代码</th><th>作用</th></tr>
<tr><td>登录</td><td><code>session.setAttribute("loginUser",username)</code></td><td>登录成功后保存用户名</td></tr>
<tr><td>过滤器</td><td><code>session.getAttribute("loginUser")==null</code></td><td>未登录拦截</td></tr>
<tr><td>上传</td><td><code>String author = (String)session.getAttribute("loginUser")</code></td><td>用session用户名建私有子目录</td></tr>
<tr><td>列表</td><td><code>String author = (String)session.getAttribute("loginUser")</code></td><td>只列出当前用户的文件</td></tr>
<tr><td>下载/删除</td><td>拼接 userDir = new File(uploadRoot, author)</td><td>双重校验防止越权</td></tr>
</table>
<pre class="code"><code>// 上传前拿到当前登录用户（不能从参数取！）
String author = (String) request.getSession().getAttribute("loginUser");
if (author == null) { // 双重保险（过滤器理论上已拦）
    response.sendRedirect(request.getContextPath() + "/login.jsp");
    return;
}
// 按用户名建子目录，每个用户独立
File userDir = new File(uploadRoot, author);
userDir.mkdirs(); // 递归创建</code></pre>
<div class="kp-warn"><b>⚠️ 绝对不能从request.getParameter取用户名！</b>用户可以改URL或表单参数，冒充任何用户上传/下载/删除文件。所有敏感操作必须从session取身份。</div>
</script>
</script>

<script type="text/html" id="kp-setattribute">
<script type="text/html" id="kp-setattribute">
<div class="kp-def"><b>setAttribute(String name, Object value)</b> 是<b>三大域对象（ServletContext/HttpSession/HttpServletRequest）共有的方法</b>，把一个Java对象以键值对形式存入域中，供后续转发/同会话/全局范围内使用。</div>

<h4 style="margin:12px 0 8px;">三个域的 setAttribute 对比</h4>
<table>
<tr><th>域对象</th><th>作用范围</th><th>何时失效</th><th>典型场景</th></tr>
<tr><td><code>request.setAttribute(k,v)</code></td><td>一次请求（forward有效，redirect失效）</td><td>响应返回</td><td>Servlet查完数据传给JSP展示（最常用）</td></tr>
<tr><td><code>session.setAttribute(k,v)</code></td><td>一次会话（同浏览器的多次请求）</td><td>超时/invalidate</td><td>登录用户、购物车、验证码</td></tr>
<tr><td><code>application.setAttribute(k,v)</code></td><td>整个应用（所有用户共享）</td><td>应用关闭</td><td>在线人数、全局配置</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 三个配套方法</h4>
<ul>
  <li><b>存</b>：<code>setAttribute("key", value)</code> —— key相同会覆盖（类似Map.put）；</li>
  <li><b>取</b>：<code>getAttribute("key")</code> —— 返回 <code>Object</code>，必须强转；不存在返回 <code>null</code>；</li>
  <li><b>删</b>：<code>removeAttribute("key")</code> —— 手动删除（不用等域销毁）。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 最小作用域原则（非常重要！）</h4>
<pre class="code"><code>// ✅ 正确：Servlet→JSP传数据用request域（生命周期最短，内存及时释放）
request.setAttribute("userList", userList);
request.getRequestDispatcher("/userList.jsp").forward(request, response);

// ❌ 错误：什么都往session里塞
session.setAttribute("userList", userList); // 用户看完列表还占着内存！

// ✅ 登录用户跨页面用session
session.setAttribute("loginUser", user);

// ✅ 全局共享用application（线程安全考虑）
application.setAttribute("onlineCount", count);</code></pre>

<div class="kp-warn"><b>⚠️ 常见错误：</b>
<ul style="margin:4px 0 0 16px;">
  <li><b>setAttribute 后重定向</b>：sendRedirect是新请求，request域丢失！要传数据必须用forward或session/拼接参数；</li>
  <li><b>key 拼写不一致</b>：存的时候"userList"，取的时候"users"，返回null但不报错——建议用常量 <code>public static final String USER_LIST = "userList";</code>；</li>
  <li>getAttribute返回Object忘记强转：编译不报错，运行 <code>ClassCastException</code>。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-submitted-filename">
<script type="text/html" id="kp-submitted-filename">
<div class="kp-def"><b>part.getSubmittedFileName()</b> 获取客户端上传的<b>原始文件名</b>（含扩展名），从Content-Disposition头的filename参数解析。是保存文件时确定扩展名、原始展示名的关键字段。</div>
<h4 style="margin:12px 0 8px;">文件名处理的4个坑（必须全部处理）</h4>
<table>
<tr><th>坑</th><th>现象</th><th>解决代码</th></tr>
<tr><td>IE返回完整路径</td><td><code>"C:\Users\xx\作业.docx"</code></td><td><code>fileName.substring(fileName.lastIndexOf("\\")+1)</code></td></tr>
<tr><td>中文文件名乱码</td><td>变成ä½œä¸.docx</td><td><code>new String(fileName.getBytes("ISO-8859-1"),"UTF-8")</code></td></tr>
<tr><td>同名文件覆盖</td><td>张三李四都叫"作业.docx"会互相覆盖</td><td>用UUID重命名保存，原名存在FileMeta里</td></tr>
<tr><td>空文件</td><td>不选文件就提交，返回""或null</td><td><code>if(fileName==null||fileName.trim().isEmpty()) 提示</code></td></tr>
</table>
<pre class="code"><code>// 企业级文件名处理完整工具方法
private String resolveFileName(Part part) {
    String fileName = part.getSubmittedFileName();
    if (fileName == null) return null;
    int slash = Math.max(fileName.lastIndexOf('/'), fileName.lastIndexOf('\\'));
    if (slash > -1) fileName = fileName.substring(slash + 1);
    try { fileName = new String(fileName.getBytes("ISO-8859-1"), "UTF-8"); }
    catch (Exception ignore) {}
    return fileName;
}
// 避免覆盖：UUID重命名（保留扩展名）
String ext = fileName.substring(fileName.lastIndexOf('.'));
String saveName = UUID.randomUUID().toString() + ext;</code></pre>
<div class="kp-warn"><b>⚠️ 不能直接用原文件名保存！</b>除了覆盖问题，原文件名可能含有 <code>../</code>、特殊字符、空格，存在路径穿越风险。必须重命名。</div>
</script>
</script>

<script type="text/html" id="kp-tag-page">
<div class="kpcard-head"><span class="kptag">🏷️</span><span class="kpname">&lt;%@ page %&gt; 指令（JSP 页面声明）</span><span class="cat" style="background:#fce7f3;color:#bf3989;">标签/表达式</span></div>
<div class="kpcard-body">
  <div class="def">
    <h4>📖 定义</h4>
    <p><code class="hl">&lt;%@ page ... %&gt;</code> 是 JSP 的<b>页面指令</b>（page directive），用来告诉 JSP 引擎当前页面的 MIME 类型、字符编码、导入哪些 Java 类、是否启用会话等。它必须放在 JSP 文件<b>最顶部</b>（先于任何 HTML/脚本输出），一个 JSP 可以有多条 page 指令，但同属性只能出现一次（import 除外）。</p>
  </div>

  <div class="syn">
    <h4>📝 标准写法</h4>
<pre><code><span class="tag">&lt;%@ page </span><span class="attr">contentType</span>=<span class="str">"text/html;charset=UTF-8"</span> <span class="attr">language</span>=<span class="str">"java"</span><span class="tag">%&gt;</span>
<span class="tag">&lt;%@ page </span><span class="attr">import</span>=<span class="str">"java.util.List, com.example.bookadmin.entity.Book"</span><span class="tag">%&gt;</span>
<span class="tag">&lt;%@ page </span><span class="attr">session</span>=<span class="str">"true"</span> <span class="attr">errorPage</span>=<span class="str">"error.jsp"</span><span class="tag">%&gt;</span></code></pre>
  </div>

  <div class="grid2">
    <div>
      <h4>📊 常用属性一览</h4>
      <table>
        <thead><tr><th>属性</th><th>默认值</th><th>作用</th></tr></thead>
        <tbody>
          <tr><td><code>contentType</code></td><td>text/html;charset=ISO-8859-1</td><td>设置响应 MIME 类型与编码，中文必须写 <b>UTF-8</b></td></tr>
          <tr><td><code>pageEncoding</code></td><td>ISO-8859-1</td><td>JSP 源文件本身的解码编码（中文页面建议与 contentType 一致 UTF-8）</td></tr>
          <tr><td><code>language</code></td><td>java</td><td>脚本语言，目前只能写 java</td></tr>
          <tr><td><code>import</code></td><td>（无）</td><td>导包，唯一可以重复出现的属性；逗号分隔多个类</td></tr>
          <tr><td><code>session</code></td><td>true</td><td>是否自动创建 session 对象；false 则不能直接用 &lt;%=session%&gt;</td></tr>
          <tr><td><code>errorPage</code></td><td>（无）</td><td>当前页抛异常时跳转的错误页</td></tr>
          <tr><td><code>isErrorPage</code></td><td>false</td><td>是否作为错误页，true 才可以使用 exception 内置对象</td></tr>
          <tr><td><code>isELIgnored</code></td><td>false</td><td>是否忽略 EL 表达式 ${}；true 会按原样输出不解析</td></tr>
        </tbody>
      </table>
    </div>
    <div>
      <h4>❌ 高频错误</h4>
      <ul>
        <li><b>漏写 contentType="...;charset=UTF-8"</b>：页面中文全部变成 <b>???</b> 或 <b>å¼ ä¸</b> 乱码，这是最常见的问题。</li>
        <li><b>page 指令放在 HTML 后面</b>：例如先写 <code>&lt;!DOCTYPE html&gt;</code> 再写 page，会导致 contentType 设置无效、仍按 ISO-8859-1 响应。</li>
        <li><b>import 多类时写错分隔符</b>：必须用<b>英文逗号</b>分隔，不能写多条 import 属性（虽然多数容器兼容，但不规范）。</li>
        <li><b>contentType 写成 text/plain</b>：浏览器会把整个页面当纯文本显示，HTML 标签全可见。</li>
        <li><b>同时用 pageEncoding 和 contentType charset 不一致</b>：会产生"编译用 UTF-8 读源文件、响应却按 GBK 写"的混合乱码。</li>
      </ul>
    </div>
  </div>

  <div class="tip">
    <h4>💡 企业实践</h4>
    <p>每个 JSP 的第一行<b>固定模板</b>就写：<code>&lt;%@ page contentType="text/html;charset=UTF-8" language="java" %&gt;</code>，这是中文项目的"起手式"。IDEA 新建 JSP 时会自动插入这行；如果你的 IDEA 默认是 ISO-8859-1，去 <code>Settings → Editor → File Encodings → JSP Files Default encoding</code> 改成 UTF-8，一劳永逸。需要导实体类/List/Map 时再加 <code>&lt;%@ page import="..." %&gt;</code>。</p>
  </div>
</div>
</script>

<script type="text/html" id="kp-webfilter">
<script type="text/html" id="kp-webfilter">
<div class="kp-def"><b>@WebFilter</b> 是过滤器的注册注解，等价于 web.xml 中的 <code>&lt;filter&gt;</code>+<code>&lt;filter-mapping&gt;</code>。容器启动时自动扫描并把实现了 <code>Filter</code> 接口的类注册成过滤器，按路径或Servlet名匹配请求。</div>

<h4 style="margin:12px 0 8px;">拦截规则属性</h4>
<table>
<tr><th>属性</th><th>说明</th><th>典型值</th></tr>
<tr><td><code>value / urlPatterns</code></td><td>按URL路径拦截（最常用）</td><td><code>{"/*"}</code> 拦截所有；<code>{"/user/*"}</code> 拦截user目录</td></tr>
<tr><td><code>servletNames</code></td><td>按Servlet名拦截（需配合@WebServlet的name）</td><td><code>{"LoginServlet"}</code></td></tr>
<tr><td><code>filterName</code></td><td>过滤器名，默认是类全限定名</td><td><code>"encodingFilter"</code></td></tr>
<tr><td><code>initParams</code></td><td>初始化参数</td><td><code>@WebInitParam(name="encoding",value="UTF-8")</code></td></tr>
<tr><td><code>dispatcherTypes</code></td><td>拦截哪种转发方式</td><td>REQUEST/FORWARD/INCLUDE/ERROR/ASYNC</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>urlPatterns 必须写</b>，否则过滤器不拦截任何路径（等于白写）；</li>
  <li><b>拦截所有路径用 /*</b>，不是 /**（Servlet规范里没有**通配，这是新手最容易抄Spring MVC写错的地方）；</li>
  <li><b>多个过滤器同一路径</b>时，执行顺序<b>按类名字母序</b>（注解方式无法像 web.xml 那样用 &lt;filter-mapping&gt; 顺序控制），所以规范做法是类名前缀加01_、02_ 或首字母来控制顺序，如 <code>A_EncodingFilter</code> 最先执行；</li>
  <li>默认只拦截<b>直接请求 REQUEST</b>，forward/include 内部转发不会经过过滤器，需要显式加 <code>dispatcherTypes = {DispatcherType.REQUEST, DispatcherType.FORWARD}</code>。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 企业常见写法</h4>
<pre class="code"><code>@WebFilter(filterName = "encodingFilter", urlPatterns = "/*",
           initParams = @WebInitParam(name = "encoding", value = "UTF-8"))
public class EncodingFilter implements Filter { ... }</code></pre>

<div class="kp-warn"><b>⚠️ 顺序坑：</b>使用注解配置多过滤器时，不要依赖"先写哪个类就先执行"，这不是规范！必须按<b>类名字母序</b>规划。如果项目里过滤器很多（>3个），建议改回 web.xml 配置以明确顺序。</div>
</script>
</script>

<script type="text/html" id="kp-weblistener">
<script type="text/html" id="kp-weblistener">
<div class="kp-def"><b>@WebListener</b> 这次课用来做<b>上传目录自动初始化</b>：应用启动时自动创建upload根目录，并把路径存入ServletContext全局域，避免每个Servlet重复判断目录是否存在，也避免"目录不存在IOException"。</div>
<h4 style="margin:12px 0 8px;">为什么用Listener创建目录？</h4>
<table>
<tr><th>方案</th><th>时机</th><th>问题</th></tr>
<tr><td>在Servlet.init()里创建</td><td>第一次访问该Servlet</td><td>访问/upload前访问/download会NPE</td></tr>
<tr><td>在Filter.init()里创建</td><td>应用启动时（loadOnStartup）</td><td>可以，但Filter职责应该是过滤，不是初始化</td></tr>
<tr><td><b>ServletContextListener.contextInitialized()</b></td><td><b>应用启动即刻，所有Servlet/Filter之前</b></td><td><b>✅ 最佳实践，职责单一</b></td></tr>
</table>
<pre class="code"><code>@WebListener
public class UploadDirInitListener implements ServletContextListener {
    public void contextInitialized(ServletContextEvent sce) {
        ServletContext app = sce.getServletContext();
        // 获取部署真实路径，创建upload目录
        String uploadPath = app.getRealPath("/upload");
        File dir = new File(uploadPath);
        if (!dir.exists()) dir.mkdirs();   // 递归创建
        app.setAttribute("uploadPath", uploadPath); // 存全局域，所有Servlet共享
        System.out.println("✓ 上传目录已创建：" + uploadPath);
    }
    public void contextDestroyed(ServletContextEvent sce) { /* 关闭时清理 */ }
}</code></pre>
<div class="kp-warn"><b>⚠️ 教学简化：</b>生产环境不要用 <code>getRealPath("/upload")</code>——重新部署war时Tomcat会清空work目录，文件丢失！生产环境一般配置外部目录（如 <code>D:/upload</code>）或用对象存储OSS。教学场景为简化演示用getRealPath。</div>
</script>
</script>

<script type="text/html" id="kp-webservlet">
<script type="text/html" id="kp-webservlet">
<div class="kp-def"><b>@WebServlet</b> 是Jakarta Servlet 6.0提供的<b>类级注解</b>，把一个类注册为Servlet，替代web.xml中<code>&lt;servlet&gt;+&lt;servlet-mapping&gt;</code>配置。第二次课用它配置4个业务Servlet：上传/下载/列表/删除。</div>
<h4 style="margin:12px 0 8px;">文件上传下载场景用法</h4>
<table>
<tr><th>Servlet</th><th>映射URL</th><th>请求方式</th><th>关键注解</th></tr>
<tr><td>LoginServlet</td><td><code>/login</code></td><td>GET+POST</td><td>@WebServlet("/login")</td></tr>
<tr><td>UploadServlet</td><td><code>/upload</code></td><td>GET(表单)+POST(上传)</td><td>@WebServlet("/upload") <b style="color:#cf222e;">+ @MultipartConfig</b></td></tr>
<tr><td>ListServlet</td><td><code>/list</code></td><td>GET</td><td>@WebServlet("/list")</td></tr>
<tr><td>DownloadServlet</td><td><code>/download</code></td><td>GET（超链接点击）</td><td>@WebServlet("/download")</td></tr>
<tr><td>DeleteServlet</td><td><code>/delete</code></td><td>GET（教学简化）</td><td>@WebServlet("/delete")</td></tr>
</table>
<pre class="code"><code>// 最简写法（最常用）
@WebServlet("/upload")
public class UploadServlet extends HttpServlet { ... }</code></pre>
<div class="kp-warn"><b>⚠️ 文件上传Servlet必须同时加 @MultipartConfig</b>，否则 request.getPart() 返回 null，后续调用 getSubmittedFileName() 直接抛 NullPointerException。</div>
</script>
</script>

<script>

function installWatermarkAndCopyright(){
  var watermark = document.getElementById('__wm__');
  var copyright = document.getElementById('__cr__');

  // ============ 水印（浅灰色fixed铺满视口，随滚动始终可见，不依赖页面高度）============
  if (typeof SHOW_WATERMARK !== 'undefined' && SHOW_WATERMARK) {
    if (watermark) watermark.remove();
    watermark = document.createElement('div');
    watermark.id = '__wm__';
    document.body.appendChild(watermark);

    var text = (typeof WATERMARK_TEXT !== 'undefined') ? WATERMARK_TEXT : '';
    var charCount = text.length || 10;
    var fontSize = 16;
    var unitW = fontSize * 1.05;
    var textPixelWidth = charCount * unitW;
    var stepX = Math.ceil(textPixelWidth * 1.8);     // 水平步长=字宽×1.8，16字也绝对不重叠
    var stepY = 160;                                  // 垂直步长
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    // 多铺一圈，视口滚动resize时不出现空白
    var cols = Math.ceil(vw / stepX) + 3;
    var rows = Math.ceil(vh / stepY) + 3;

    watermark.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:9998;pointer-events:none;overflow:hidden;';
    var frag = document.createDocumentFragment();
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var t = document.createElement('span');
        t.textContent = text;
        // 奇数行错开半个步长，形成菱形交错
        var offsetX = (r % 2 === 0) ? 0 : stepX / 2;
        t.style.cssText = 'position:absolute;'
          + 'left:' + (c * stepX + offsetX - stepX) + 'px;'
          + 'top:'  + (r * stepY - stepY) + 'px;'
          + 'font-size:' + fontSize + 'px;'
          + 'color:#a8a8a8;'                  // 浅灰色
          + 'opacity:0.07;'                   // 极淡，仅隐约可见
          + 'font-weight:400;'
          + 'letter-spacing:2px;'
          + 'white-space:nowrap;'
          + 'transform:rotate(-25deg);'
          + 'transform-origin:left top;'
          + 'user-select:none;';
        frag.appendChild(t);
      }
    }
    watermark.appendChild(frag);
  } else {
    if (watermark) { watermark.remove(); watermark = null; }
  }

  // ============ 版权信息条（追加到 main 末尾）============
  if (typeof SHOW_COPYRIGHT !== 'undefined' && SHOW_COPYRIGHT) {
    if (copyright) copyright.remove();
    copyright = document.createElement('div');
    copyright.id = '__cr__';
    copyright.style.cssText = 'text-align:center;padding:22px 20px;color:#8a8f98;font-size:12px;border-top:1px solid #eaecef;background:#f6f8fa;margin-top:40px;line-height:1.9;clear:both;';
    var main = document.getElementById('main');
    var projName = document.title.replace(' - JSP交互教学课件','').replace(' · 分步向导','');
    copyright.innerHTML = '<div style="font-weight:600;color:#57606a;margin-bottom:4px;letter-spacing:0.5px;">'
      + ((typeof COPYRIGHT_TEXT !== 'undefined') ? COPYRIGHT_TEXT : '')
      + '</div>'
      + '<div>项目：<b style="color:#0969da;">' + projName + '</b> · 课时：4×40分钟=160分钟 · 适用环境：JDK 17 + IDEA 2024.1 + Tomcat 10.1.59 + Maven 3.9+</div>';
    if (main) main.appendChild(copyright);
    else document.body.appendChild(copyright);
  } else {
    if (copyright) { copyright.remove(); copyright = null; }
  }
}
window.addEventListener('resize', function(){ installWatermarkAndCopyright(); });

var _origRender = render;
render = function(){
  try { _origRender.apply(this, arguments); }
  catch(e){ console.error(e); }
  // 切换步骤/知识点后面板展开可能改变布局，重新铺设一次
  setTimeout(installWatermarkAndCopyright, 100);
};

// 首次渲染
render();

</script>
</body>

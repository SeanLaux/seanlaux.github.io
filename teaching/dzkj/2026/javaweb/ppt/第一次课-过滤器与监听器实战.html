<script type="text/html" id="kp-basic-java">
<div class="kpcard-head"><span class="kptag">📘</span><span class="kpname">Maven/Java基础结构（pom坐标、package、import）</span><span class="cat" style="background:#ddf4ff;color:#0969da;">基础</span></div>
<div class="kpcard-body">
  <div class="def">
    <h4>📖 定义</h4>
    <p>任何一个标准的 Java Web 项目都由三部分"基础骨架"组成：<b>Maven 工程坐标</b>（pom.xml）、<b>包声明 package</b>（.java 首行）、<b>类导入 import</b>（package 之后）。这三者本身不是 Servlet/Filter 新增的语法，而是 <b>Java 项目通用规范</b>，但在 Servlet 开发里必须写对，否则 Tomcat 连项目都认不出来、类也编译不过。</p>
  </div>

  <div class="syn">
    <h4>📝 三段骨架示例</h4>
<pre><code><span class="c">&lt;!-- 1) pom.xml：Maven 坐标（三坐标 + 打包方式） --&gt;</span>
<span class="tag">&lt;groupId&gt;</span>com.example<span class="tag">&lt;/groupId&gt;</span>
<span class="tag">&lt;artifactId&gt;</span>bookadmin<span class="tag">&lt;/artifactId&gt;</span>
<span class="tag">&lt;version&gt;</span>1.0-SNAPSHOT<span class="tag">&lt;/version&gt;</span>
<span class="tag">&lt;packaging&gt;</span>war<span class="tag">&lt;/packaging&gt;</span>      <span class="c">&lt;!-- Web 项目必须打 war --&gt;</span>

<span class="c">// 2) .java 第 1 行：package 声明（必须与目录结构严格一致）</span>
<span class="kw">package</span> com.example.bookadmin.filter;

<span class="c">// 3) package 之后：import 所需的 Jakarta 类</span>
<span class="kw">import</span> jakarta.servlet.Filter;
<span class="kw">import</span> jakarta.servlet.FilterChain;
<span class="kw">import</span> jakarta.servlet.ServletException;
<span class="kw">import</span> jakarta.servlet.annotation.WebFilter;
<span class="kw">import</span> jakarta.servlet.http.HttpServletRequest;</code></pre>
  </div>

  <div class="grid2">
    <div>
      <h4>✅ 正确写法要点</h4>
      <ul>
        <li><code class="hl">&lt;packaging&gt;war&lt;/packaging&gt;</code>：<b>Web 项目必须</b>打 war 包，默认是 jar，Tomcat 不识别。</li>
        <li><code class="hl">package com.xxx.yyy;</code> 必须是.java文件<b>第一行非注释语句</b>，且要和 <code>src/main/java/com/xxx/yyy/</code> 目录完全对应（大小写敏感）。</li>
        <li>IDEA 里红色飘红的类都要 import，否则编译报 <code>cannot find symbol</code>；用 <code>Alt+Enter</code> 自动导包最快。</li>
        <li>Jakarta 命名空间从 <b>Tomcat 10 / Servlet 6.0 起</b>必须用 <code>jakarta.servlet.*</code>，老项目的 <code>javax.servlet.*</code> 在 Tomcat 10 下会 <code>ClassNotFoundException</code>。</li>
        <li>scope 为 provided 的依赖（如 servlet-api）<b>不会打进 war 包</b>，因为 Tomcat 自己的 lib 里已有，重复会 <code>ClassCastException</code>。</li>
      </ul>
    </div>
    <div>
      <h4>❌ 高频错误</h4>
      <ul>
        <li><b>package 漏写</b>：直接写 public class，或写到了子目录却没声明 package，IDEA 会提示 "Package name does not correspond to the file path"。</li>
        <li><b>import 写错包</b>：IDEA 自动补全时可能导入 <code>com.sun.*</code> 或其他不同版本的同名类，必须看清是 <code>jakarta.servlet.*</code>。</li>
        <li><b>依赖版本冲突</b>：同时引入 jakarta.servlet-api 5.0 和 6.0，会报 <code>NoClassDefFoundError</code>。</li>
        <li><b>漏加 packaging=war</b>：默认打 jar 包，Tomcat 部署 war 时虽能部署但缺 web 资源目录结构，JSP 访问 404。</li>
        <li><b>漏加 maven-compiler-plugin</b>：IDEA 默认按 JDK 1.5 编译，会导致 lambda、var 等语法报错，必须显式配 <code>source/target=17</code>。</li>
      </ul>
    </div>
  </div>

  <div class="tip">
    <h4>💡 小技巧</h4>
    <p>新建 Maven 项目时优先选 IDEA 的 <code>Jakarta EE / Web Application</code> 模板（或 maven-archetype-webapp），pom.xml、webapp 目录、WEB-INF 都会自动生成，避免骨架写错。每次改完 pom.xml 记得点 Maven 面板的 "🔄 Reload All Maven Projects" 让依赖生效。</p>
  </div>
</div>
</script>

<script type="text/html" id="kp-chain-dofilter">
<script type="text/html" id="kp-chain-dofilter">
<div class="kp-def"><b>FilterChain.doFilter(ServletRequest req, ServletResponse resp)</b> 是过滤器链的<b>放行指令</b>，作用是把请求交给<b>链上的下一个过滤器</b>，所有过滤器都放行后最终到达目标Servlet。它是Filter机制里最核心的一行代码。</div>

<h4 style="margin:12px 0 8px;">过滤器链执行顺序</h4>
<table>
<tr><th>执行顺序</th><th>触发位置</th><th>典型用途</th></tr>
<tr><td>① 过滤器1 前置</td><td>chain.doFilter 之前</td><td>编码设置、日志开始时间</td></tr>
<tr><td>② 过滤器2 前置</td><td>chain.doFilter 之前</td><td>登录校验、权限判断</td></tr>
<tr><td>③ ……</td><td>……</td><td>……</td></tr>
<tr><td>④ Servlet 执行</td><td>最后一个Filter的chain.doFilter</td><td>业务逻辑</td></tr>
<tr><td>⑤ 过滤器2 后置</td><td>chain.doFilter 之后</td><td>响应压缩、日志记耗时</td></tr>
<tr><td>⑥ 过滤器1 后置</td><td>chain.doFilter 之后</td><td>全局响应头处理</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>"放行"不等于返回</b>：chain.doFilter 是<b>方法调用</b>不是 return，调用后会"进入下一层"，等下层全部执行完后<b>再回到本行继续执行下面的代码</b>——这就是后置处理能工作的原因；</li>
  <li><b>参数必须传 req 和 resp</b>（传原对象，不能 new 新对象，除非使用包装器模式做 XSS/SQL 注入过滤）；</li>
  <li>如果前置处理中已经发现不合法（未登录、IP被封），<b>不要调用 chain.doFilter</b>，直接用 response.sendRedirect 或写错误信息返回即可——这是"拦截"的本质。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 记录请求耗时的经典写法（前后都用）</h4>
<pre class="code"><code>public void doFilter(ServletRequest req, ServletResponse resp, FilterChain chain)
        throws IOException, ServletException {
    long start = System.currentTimeMillis();       // 前置
    try {
        chain.doFilter(req, resp);                 // 放行
    } finally {
        long cost = System.currentTimeMillis() - start; // 后置（即使异常也要记）
        System.out.println("请求耗时：" + cost + "ms");
    }
}</code></pre>

<div class="kp-warn"><b>⚠️ 易错点：</b>
<ul style="margin:4px 0 0 16px;">
  <li><b>不放行 + 不写响应 = 白屏</b>：浏览器一直等服务器返回直到超时；</li>
  <li>在 chain.doFilter 之后再用 response 做 forward/sendRedirect 会抛 <code>IllegalStateException: 响应已提交</code>；</li>
  <li>chain.doFilter 后修改响应头可能无效（因为输出流已经写出），要加响应头必须写在前置。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-doget">
<script type="text/html" id="kp-doget">
<div class="kp-def"><b>doGet(HttpServletRequest req, HttpServletResponse resp)</b> 是 HttpServlet 处理 <b>HTTP GET 请求</b>的方法。浏览器直接URL访问、&lt;a href="..."&gt;链接、&lt;form method="get"&gt;表单、AJAX GET 都会进入这个方法。</div>

<h4 style="margin:12px 0 8px;">GET vs POST 对比</h4>
<table>
<tr><th>特性</th><th>GET</th><th>POST</th></tr>
<tr><td>参数位置</td><td>URL查询串 <code>?name=xxx&age=18</code></td><td>请求体（HTTP body）</td></tr>
<tr><td>长度限制</td><td>约2KB~8KB（浏览器+服务器限制）</td><td>理论无限制（服务器可配）</td></tr>
<tr><td>安全性</td><td>参数明文在URL，<b>不能传敏感数据</b></td><td>在body中，相对安全（仍需HTTPS）</td></tr>
<tr><td>幂等性</td><td>✅ 幂等（多次调用结果相同）</td><td>❌ 非幂等（重复提交会下单/扣款多次）</td></tr>
<tr><td>用途</td><td>查数据、读页面、跳转</td><td>提交数据（登录/注册/上传/下单）</td></tr>
<tr><td>书签/分享</td><td>✅ URL带参数可收藏</td><td>❌ 不能收藏</td></tr>
<tr><td>浏览器后退</td><td>无害</td><td>会提示"重新提交表单"</td></tr>
<tr><td>编码</td><td>Tomcat 8.5+ 默认UTF-8已解决</td><td>必须 setCharacterEncoding("UTF-8")</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>HttpServlet 默认 doGet/doPost 返回 405 Method Not Allowed</b>，没重写哪个方法，用哪种方式请求就405；</li>
  <li>想让一个Servlet同时支持GET和POST处理同一逻辑，常见写法：<code>doGet 调用 doPost</code>（或反过来），避免重复代码；</li>
  <li><b>不要在doGet里做写操作</b>（删/改/新增），因为URL会被爬虫、浏览器预加载、搜索引擎抓取触发，导致数据被误删。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 统一分发写法</h4>
<pre class="code"><code>@WebServlet("/user")
public class UserServlet extends HttpServlet {
    protected void doGet(HttpServletRequest req, HttpServletResponse resp)
            throws ServletException, IOException {
        this.doPost(req, resp); // GET POST 统一处理
    }
    protected void doPost(HttpServletRequest req, HttpServletResponse resp)
            throws ServletException, IOException {
        req.setCharacterEncoding("UTF-8");
        String action = req.getParameter("action");
        // 根据 action 分发（简化版MVC）
    }
}</code></pre>

<div class="kp-warn"><b>⚠️ 签名错误导致方法不重写：</b>参数写成 <code>ServletRequest req</code> 而不是 <code>HttpServletRequest</code>，这是<b>重载不是重写</b>，父类方法没有被覆盖，请求进来还是走父类返回405——非常隐蔽的bug！必须用 <code>@Override</code> 注解，写错IDE直接报错。</div>
</script>
</script>

<script type="text/html" id="kp-dopost">
<script type="text/html" id="kp-dopost">
<div class="kp-def"><b>doPost(HttpServletRequest req, HttpServletResponse resp)</b> 是 HttpServlet 处理 <b>HTTP POST 请求</b>的方法。&lt;form method="post"&gt;表单提交、AJAX POST、文件上传都会进入。它用来提交敏感/大量数据，做写操作（新增/修改/删除）。</div>

<h4 style="margin:12px 0 8px;">POST 的编码问题（必考点）</h4>
<table>
<tr><th>请求方式</th><th>乱码原因</th><th>解决方式</th></tr>
<tr><td>POST 请求体</td><td>容器默认用 ISO-8859-1 解析body</td><td><code>req.setCharacterEncoding("UTF-8");</code> 必须在第一次getParameter前调用</td></tr>
<tr><td>响应输出</td><td>浏览器默认按系统编码显示</td><td><code>resp.setContentType("text/html;charset=UTF-8");</code></td></tr>
<tr><td>GET 参数（Tomcat ≤8）</td><td>URL解码用ISO-8859-1</td><td>Tomcat conf/server.xml Connector加 <code>URIEncoding="UTF-8"</code></td></tr>
<tr><td>GET 参数（Tomcat ≥8.5）</td><td>已默认UTF-8</td><td>无需额外配置</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>必须先设置编码，再取参数</b>：如果先写 getParameter() 再 setCharacterEncoding，<b>设置无效</b>，中文已经按ISO解码完了；</li>
  <li><b>每个doPost都要写？——不，用过滤器统一解决</b>，这就是过滤器最大价值之一：避免每个Servlet重复编码设置（后面EncodingFilter演示）；</li>
  <li>POST 提交表单的 <code>enctype</code> 属性：默认 <code>application/x-www-form-urlencoded</code>（普通表单），文件上传必须用 <code>multipart/form-data</code>（第二次课讲）。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 doPost 的标准4步结构</h4>
<pre class="code"><code>protected void doPost(HttpServletRequest req, HttpServletResponse resp)
        throws ServletException, IOException {
    // ① 设置编码（或交给EncodingFilter统一做）
    req.setCharacterEncoding("UTF-8");
    resp.setContentType("text/html;charset=UTF-8");
    // ② 接收参数
    String username = req.getParameter("username");
    String password = req.getParameter("password");
    // ③ 处理业务（调用Service）
    boolean ok = userService.login(username, password);
    // ④ 跳转页面（转发或重定向）
    if (ok) {
        resp.sendRedirect(req.getContextPath() + "/index");
    } else {
        req.setAttribute("msg", "用户名或密码错误");
        req.getRequestDispatcher("/login.jsp").forward(req, resp);
    }
}</code></pre>

<div class="kp-warn"><b>⚠️ 防止重复提交（PRG模式）：</b>POST处理完后<b>务必用 sendRedirect 重定向</b>到GET页面，不要直接forward到成功页！否则用户按F5刷新会重复提交表单（重复下单、重复扣款）。这就是 <b>PRG模式 = Post-Redirect-Get</b>，企业开发必须遵守。</div>
</script>
</script>

<script type="text/html" id="kp-filter">
<script type="text/html" id="kp-filter">
<div class="kp-def"><b>jakarta.servlet.Filter</b> 是过滤器的核心接口，用于在<b>请求到达Servlet之前、响应返回浏览器之前</b>做统一的预处理/后处理。典型用途：统一编码、登录校验、日志记录、敏感词过滤、跨域处理、XSS过滤、权限校验、压缩响应等"横切关注点"。</div>

<h4 style="margin:12px 0 8px;">Filter 三个生命周期方法</h4>
<table>
<tr><th>方法</th><th>调用时机</th><th>常用操作</th></tr>
<tr><td><code>init(FilterConfig config)</code></td><td>项目启动、过滤器被创建时调用<b>一次</b></td><td>读取初始化参数、初始化资源（连接池、线程池等）</td></tr>
<tr><td><code>doFilter(ServletRequest req, ServletResponse resp, FilterChain chain)</code></td><td><b>每次请求匹配路径都会调用</b>，核心方法</td><td>前置处理 → chain.doFilter放行 → 后置处理</td></tr>
<tr><td><code>destroy()</code></td><td>项目关闭/过滤器被销毁时调用一次</td><td>释放资源（关流、关连接）</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 工作流程图解</h4>
<pre class="code"><code>浏览器 → [过滤器1前置] → [过滤器2前置] → [Servlet处理业务]
         [过滤器1后置] ← [过滤器2后置] ← 返回响应</code></pre>
<ul>
  <li><b>chain.doFilter(req,resp) 是"放行"</b>：调用它才会继续执行下一个过滤器 → 最终到Servlet；不调用 = 请求被拦截，直接返回（典型场景：未登录跳到登录页）；</li>
  <li><b>doFilter 前后都可以写代码</b>：前面是"请求预处理"，chain.doFilter 之后是"响应后处理"，此时Servlet已经执行完，可以拿到响应数据做加工；</li>
  <li>ServletRequest/ServletResponse 是<b>通用协议无关</b>的父接口，实际HTTP场景必须强转成 <code>HttpServletRequest</code>/<code>HttpServletResponse</code> 才能用 getSession、getHeader 等方法。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 最简骨架</h4>
<pre class="code"><code>@WebFilter("/*")
public class XxxFilter implements Filter {
    public void init(FilterConfig config) {}
    public void doFilter(ServletRequest req, ServletResponse resp,
                         FilterChain chain) throws IOException, ServletException {
        HttpServletRequest  request  = (HttpServletRequest) req;
        HttpServletResponse response = (HttpServletResponse) resp;
        // ① 前置处理
        chain.doFilter(req, resp);   // ② 放行
        // ③ 后置处理
    }
    public void destroy() {}
}</code></pre>

<div class="kp-warn"><b>⚠️ 经典错误：</b>
<ul style="margin:4px 0 0 16px;">
  <li>忘记调用 <code>chain.doFilter()</code>：请求被"卡住"，浏览器一直白屏转圈；</li>
  <li>不放行也不写response响应：浏览器等到超时；</li>
  <li>doFilter里直接用 request.getSession() —— 没强转！必须先 <code>(HttpServletRequest)request</code>。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-filterconfig">
<script type="text/html" id="kp-filterconfig">
<div class="kp-def"><b>FilterConfig</b> 是过滤器的<b>配置对象</b>，由容器在 init 方法调用时作为参数传入。通过它可以获取过滤器名、初始化参数、ServletContext 等，作用类似 Servlet 的 ServletConfig。</div>

<h4 style="margin:12px 0 8px;">FilterConfig 常用方法</h4>
<table>
<tr><th>方法</th><th>返回值</th><th>用途</th></tr>
<tr><td><code>getFilterName()</code></td><td>String</td><td>获取当前过滤器名字（@WebFilter 的 filterName）</td></tr>
<tr><td><code>getInitParameter(String name)</code></td><td>String</td><td>获取单个初始化参数</td></tr>
<tr><td><code>getInitParameterNames()</code></td><td>Enumeration&lt;String&gt;</td><td>获取所有初始化参数名</td></tr>
<tr><td><code>getServletContext()</code></td><td>ServletContext</td><td>获取全局应用上下文对象</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 为什么用 initParams？</h4>
<ul>
  <li><b>硬编码 vs 配置分离</b>：编码、上传目录、白名单路径等"部署后可能改"的值不应该写死在Java代码里，通过 initParams 配置后，改了不用重新编译、重启即可生效；</li>
  <li><b>只在 init 里取一次</b>：取出来后存到成员变量里，doFilter 直接用，避免每次请求都调用 getInitParameter（虽然性能影响不大，但这是规范写法）；</li>
  <li>多个Filter实例可以配不同参数值，复用同一个Filter类。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 完整写法</h4>
<pre class="code"><code>@WebFilter(urlPatterns = "/*",
    initParams = @WebInitParam(name = "encoding", value = "UTF-8"))
public class EncodingFilter implements Filter {
    private String encoding;
    public void init(FilterConfig config) {
        this.encoding = config.getInitParameter("encoding"); // 取一次存起来
    }
    public void doFilter(ServletRequest req, ServletResponse resp,
                         FilterChain chain) throws IOException, ServletException {
        req.setCharacterEncoding(encoding); // 直接用成员变量
        chain.doFilter(req, resp);
    }
}</code></pre>

<div class="kp-warn"><b>⚠️ 注意：</b>initParams 里的 value 永远是<b>String</b>，需要 int/boolean 必须自己 <code>Integer.parseInt()</code>、<code>Boolean.parseBoolean()</code>。参数名写错不会报错，只是返回 null，要自己判空。</div>
</script>
</script>

<script type="text/html" id="kp-forward">
<script type="text/html" id="kp-forward">
<div class="kp-def"><b>request.getRequestDispatcher(path).forward(req, resp)</b> 是<b>服务器内部转发</b>，把当前请求"交给"另一个资源（JSP/Servlet）继续处理，浏览器只发一次请求、地址栏URL不变。是MVC模式中"Servlet处理业务、JSP展示页面"的核心。</div>

<h4 style="margin:12px 0 8px;">forward vs include</h4>
<table>
<tr><th>方法</th><th>特点</th><th>用途</th></tr>
<tr><td><code>forward()</code></td><td>控制权完全交给目标资源，目标处理完就结束，原Servlet后续代码不执行响应输出（但return前的代码还跑）</td><td>MVC：Servlet→JSP（最常用）</td></tr>
<tr><td><code>include()</code></td><td>目标资源的输出"包含"进来，原Servlet还能继续写响应</td><td>页面布局（页眉/页脚包含，目前JSP更常用&lt;jsp:include&gt;）</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>路径以 / 开头</b>，相对于<b>项目根</b>（不是服务器根），所以不加项目名：<code>getRequestDispatcher("/WEB-INF/jsp/list.jsp")</code>；</li>
  <li><b>转发到WEB-INF下</b>：浏览器不能直接访问WEB-INF里的JSP，但转发可以！这是保护JSP不被直接访问的标准做法；</li>
  <li>转发前后是<b>同一个request</b>，所以request.setAttribute 的数据目标JSP能取到；</li>
  <li>forward 之前如果response已经写出了缓冲区内容，会抛 <code>IllegalStateException</code>。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 经典MVC写法</h4>
<pre class="code"><code>// Controller：查数据、存request、转发到JSP展示
List&lt;User&gt; list = userService.findAll();
request.setAttribute("userList", list); // 把数据放进request域
request.getRequestDispatcher("/WEB-INF/jsp/userList.jsp")
       .forward(request, response);     // 转发给JSP渲染</code></pre>

<div class="kp-warn"><b>⚠️ 和重定向怎么选？</b>
<ul style="margin:4px 0 0 16px;">
  <li><b>要保留request数据 + 地址栏不需要变 → forward</b>（查数据回显、错误提示）；</li>
  <li><b>写操作之后（增删改）→ sendRedirect（PRG模式防重复提交）</b>；</li>
  <li><b>跳外部网站/其他项目 → sendRedirect</b>（forward只能站内）；</li>
  <li><b>想让用户能书签URL → sendRedirect</b>（forward地址栏不变，收藏还是原URL）。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-getparam">
<script type="text/html" id="kp-getparam">
<div class="kp-def"><b>request.getParameter(String name)</b> 是 <code>HttpServletRequest</code> 最常用的方法，<b>按参数名获取HTTP请求提交的表单或URL参数值</b>，返回 String；参数不存在或name不匹配时返回 <code>null</code>。</div>

<h4 style="margin:12px 0 8px;">相关方法族</h4>
<table>
<tr><th>方法</th><th>返回值</th><th>用途</th></tr>
<tr><td><code>getParameter("name")</code></td><td>String</td><td>获取单值参数（文本框、密码、单选、下拉、隐藏域），最常用</td></tr>
<tr><td><code>getParameterValues("name")</code></td><td>String[]</td><td>获取同name多值（复选框checkbox、多选select）</td></tr>
<tr><td><code>getParameterMap()</code></td><td>Map&lt;String,String[]&gt;</td><td>获取所有参数（BeanUtils/Spring MVC 数据绑定底层用）</td></tr>
<tr><td><code>getParameterNames()</code></td><td>Enumeration&lt;String&gt;</td><td>获取所有参数名</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>只认name，不认id</b>：表单控件必须有 name 属性才会被提交，写了id没写name → getParameter返回null（新手坑Top1）；</li>
  <li><b>返回值永远是String</b>：年龄18要手动 <code>Integer.parseInt(ageStr)</code>，日期要手动 <code>LocalDate.parse()</code>；</li>
  <li><b>空文本框返回 ""，未勾选的checkbox返回null</b>：判空必须同时判两种情况 <code>if (x == null || x.trim().isEmpty())</code>；</li>
  <li><b>POST必须先setCharacterEncoding再调用</b>，否则中文乱码；GET/POST都能取到同名参数（不要依赖容器合并规则）。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 空指针安全写法</h4>
<pre class="code"><code>// ✅ 推荐：先判null再trim
String username = request.getParameter("username");
if (username == null || username.trim().isEmpty()) {
    request.setAttribute("msg", "用户名不能为空");
    request.getRequestDispatcher("/login.jsp").forward(request, response);
    return;
}

// ❌ 错误：username为null时trim()直接抛NullPointerException
if (request.getParameter("username").trim().isEmpty()) { ... }</code></pre>

<div class="kp-warn"><b>⚠️ 数字类型转换必try-catch：</b>
<pre class="code"><code>int age = 0;
String ageStr = request.getParameter("age");
try {
    age = Integer.parseInt(ageStr);
} catch (NumberFormatException e) {
    // 用户输入非数字，给提示
}</code></pre>
不try-catch，用户输入"abc"时直接抛500错误。</div>
</script>
</script>

<script type="text/html" id="kp-listener">
<script type="text/html" id="kp-listener">
<div class="kp-def"><b>Listener（监听器）</b> 是Servlet规范中的<b>事件驱动机制</b>，采用<b>观察者模式</b>：当Web应用中特定事件发生（应用启动、session创建、属性增删等）时，容器自动调用注册的监听器对应方法。它是"被动触发"的，不像Filter是每次请求主动拦截。</div>

<h4 style="margin:12px 0 8px;">Filter vs Listener vs Servlet 对比</h4>
<table>
<tr><th>特性</th><th>Servlet</th><th>Filter</th><th>Listener</th></tr>
<tr><td>触发方式</td><td>URL匹配请求</td><td>URL匹配请求</td><td>事件驱动（自动）</td></tr>
<tr><td>是否能拦请求</td><td>处理请求</td><td>✅ 能拦截/放行</td><td>❌ 不能，只能监听</td></tr>
<tr><td>能否生成响应</td><td>✅</td><td>✅</td><td>❌ 只能观察</td></tr>
<tr><td>典型用途</td><td>业务处理</td><td>通用预处理</td><td>生命周期事件</td></tr>
<tr><td>执行时机</td><td>Filter链最后</td><td>在Servlet之前</td><td>事件发生即刻</td></tr>
<tr><td>是否有链</td><td>无</td><td>✅ FilterChain</td><td>无，同类监听器全部触发</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 三大域对象各自的监听器</h4>
<ul>
  <li><b>ServletContext</b>（application 全局域）：应用级，整个Web应用只一个，所有用户共享；监听启动/关闭、属性变化；</li>
  <li><b>HttpSession</b>（session 会话域）：用户级，每个浏览器一个；监听session创建/销毁、属性变化；</li>
  <li><b>HttpServletRequest</b>（request 请求域）：请求级，每次请求一个；监听请求创建/销毁、属性变化。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 事件对象方法</h4>
<pre class="code"><code>// 所有监听器方法的参数都是 XxxEvent
ServletContextEvent  sce   → sce.getServletContext()          // 拿到应用上下文
HttpSessionEvent      se   → se.getSession()                  // 拿到session
ServletRequestEvent   sre  → sre.getServletRequest()          // 拿到request
// Attribute 类事件还能拿属性名/值
XxxAttributeEvent e → e.getName() / e.getValue() / e.getXxx();</code></pre>

<div class="kp-warn"><b>⚠️ 监听器里别抛异常：</b>Listener 方法抛出未捕获异常会导致应用启动失败/请求中断。初始化代码要 try-catch 兜底，打日志但不阻断应用启动。</div>
</script>
</script>

<script type="text/html" id="kp-sendredirect">
<script type="text/html" id="kp-sendredirect">
<div class="kp-def"><b>response.sendRedirect(String location)</b> 是<b>重定向</b>方法，告诉浏览器"去访问另一个地址"。服务器返回 <code>302</code> 状态码+Location响应头，浏览器收到后<b>自动发起新的GET请求</b>到目标地址，地址栏URL会变化。</div>

<h4 style="margin:12px 0 8px;">重定向 vs 转发（核心考点）</h4>
<table>
<tr><th>特性</th><th>sendRedirect 重定向</th><th>forward 转发</th></tr>
<tr><td>本质</td><td>客户端行为（浏览器再发一次请求）</td><td>服务器内部行为（一次请求）</td></tr>
<tr><td>请求次数</td><td>2次</td><td>1次</td></tr>
<tr><td>地址栏</td><td>✅ 变为目标URL</td><td>❌ 不变（还是原来的URL）</td></tr>
<tr><td>request域数据</td><td>❌ 丢失（新请求）</td><td>✅ 保留（同一次请求）</td></tr>
<tr><td>能否站外跳转</td><td>✅ 能跳任意URL（百度、其他项目）</td><td>❌ 只能站内资源</td></tr>
<tr><td>目标资源</td><td>可以是HTML/JSP/Servlet/任意URL</td><td>只能是本项目内资源</td></tr>
<tr><td>速度</td><td>慢（多一次网络往返）</td><td>快（服务器内部）</td></tr>
<tr><td>开头的 /</td><td>相对于服务器根 <code>/项目名/xxx</code></td><td>相对于项目根 <code>/xxx</code></td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 路径写法（必考易错）</h4>
<ul>
  <li><b>重定向路径必须加项目名</b>（因为是浏览器重新发起请求，浏览器不知道项目名），推荐写法：<code>response.sendRedirect(request.getContextPath() + "/index");</code> —— 不要硬编码项目名，部署时换名会失效；</li>
  <li><b>转发路径不加项目名</b>：<code>request.getRequestDispatcher("/index").forward(...)</code>，因为是服务器内部；</li>
  <li>sendRedirect 调用后<b>要 return</b>，否则后面的代码还会继续执行。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 PRG模式（Post-Redirect-Get）</h4>
<pre class="code"><code>// 登录成功必须重定向（防止刷新重复提交）
if (loginSuccess) {
    session.setAttribute("loginUser", user);
    response.sendRedirect(request.getContextPath() + "/index.jsp");
    return; // 必须return，后面的代码不执行
}
// 失败可以转发回登录页（request域传错误信息）
request.setAttribute("msg", "用户名或密码错误");
request.getRequestDispatcher("/login.jsp").forward(request, response);</code></pre>

<div class="kp-warn"><b>⚠️ 注意：</b>
<ul style="margin:4px 0 0 16px;">
  <li>重定向之前不能out.write/forward过任何响应，否则抛 <code>IllegalStateException: 已提交响应</code>；</li>
  <li>sendRedirect 后记得 return，否则后续代码还执行可能导致逻辑错误。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-servletcontext">
<script type="text/html" id="kp-servletcontext">
<div class="kp-def"><b>ServletContext</b>（JSP里叫 application 内置对象）是Web应用的<b>全局上下文对象</b>，一个Web应用（一个部署的war/项目）在JVM里只<b>有一个实例</b>，所有Servlet/Filter/JSP/Listener共享。它的生命周期和Web应用一样长（服务器启动创建，服务器关闭销毁）。</div>

<h4 style="margin:12px 0 8px;">ServletContext 常用方法</h4>
<table>
<tr><th>方法</th><th>返回值</th><th>用途</th></tr>
<tr><td><code>setAttribute(name,value)</code></td><td>void</td><td>存全局共享数据（在线人数、配置）</td></tr>
<tr><td><code>getAttribute(name)</code></td><td>Object</td><td>取全局数据，需强转</td></tr>
<tr><td><code>removeAttribute(name)</code></td><td>void</td><td>删全局数据</td></tr>
<tr><td><code>getInitParameter(name)</code></td><td>String</td><td>取 web.xml 里 context-param 全局参数</td></tr>
<tr><td><code>getRealPath("/")</code></td><td>String</td><td>拿部署实际磁盘路径（上传文件常用）</td></tr>
<tr><td><code>getResourceAsStream(path)</code></td><td>InputStream</td><td>读Web应用内资源文件</td></tr>
<tr><td><code>getRequestDispatcher(path)</code></td><td>RequestDispatcher</td><td>转发</td></tr>
<tr><td><code>log(msg)</code></td><td>void</td><td>写日志到Tomcat日志文件</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 三大域对象对比</h4>
<table>
<tr><th>域对象</th><th>创建时机</th><th>销毁时机</th><th>作用范围</th><th>典型用途</th></tr>
<tr><td>ServletContext</td><td>应用启动</td><td>应用关闭</td><td>整个应用，所有用户共享</td><td>全局配置、在线计数、公共资源</td></tr>
<tr><td>HttpSession</td><td>request.getSession 首次调用</td><td>超时/调用invalidate</td><td>一次会话，单个用户</td><td>登录用户信息、购物车</td></tr>
<tr><td>HttpServletRequest</td><td>每次请求开始</td><td>响应结束</td><td>一次请求内</td><td>Servlet→JSP传数据</td></tr>
</table>

<h4 style="margin:14px 0 8px;">💡 在线人数统计经典用法</h4>
<pre class="code"><code>// 启动时初始化计数器（Listener）
sce.getServletContext().setAttribute("onlineCount", 0);
// 用户登录（sessionCreated）
synchronized (application) {
    int n = (int) application.getAttribute("onlineCount");
    application.setAttribute("onlineCount", n + 1);
}</code></pre>

<div class="kp-warn"><b>⚠️ 经典坑：</b>
<ul style="margin:4px 0 0 16px;">
  <li><b>线程不安全！</b>全局数据多线程并发访问必须加 synchronized 或用 AtomicInteger，否则在线人数会数错；</li>
  <li><b>不要存大数据</b>：大对象/大集合放 ServletContext 会占满永久代/堆内存，导致OOM；</li>
  <li><b>getAttribute 返回 Object</b>，必须强转，且取前判 null。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-session">
<script type="text/html" id="kp-session">
<div class="kp-def"><b>HttpSession</b> 是服务器端<b>会话跟踪对象</b>，用来在<b>同一个用户的多次请求之间</b>保存数据。服务器为每个首次访问的浏览器分配一个唯一的 <code>JSESSIONID</code>（通过Cookie或URL重写传给客户端），后续请求带这个ID来识别"是同一个人"。</div>

<h4 style="margin:12px 0 8px;">HttpSession 常用方法</h4>
<table>
<tr><th>方法</th><th>返回值</th><th>用途</th></tr>
<tr><td><code>setAttribute(name,value)</code></td><td>void</td><td>存数据（登录用户、购物车）</td></tr>
<tr><td><code>getAttribute(name)</code></td><td>Object</td><td>取数据（强转）</td></tr>
<tr><td><code>removeAttribute(name)</code></td><td>void</td><td>删数据</td></tr>
<tr><td><code>invalidate()</code></td><td>void</td><td>销毁整个session（注销登录用）</td></tr>
<tr><td><code>getId()</code></td><td>String</td><td>拿JSESSIONID（调试用）</td></tr>
<tr><td><code>setMaxInactiveInterval(秒)</code></td><td>void</td><td>设置超时时间（默认Tomcat 30分钟）</td></tr>
<tr><td><code>isNew()</code></td><td>boolean</td><td>是否新创建的session</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 Session 工作原理</h4>
<ul>
  <li>第一次调用 <code>request.getSession()</code> 时容器创建session，生成JSESSIONID，通过<b>响应头Set-Cookie</b>写回浏览器；</li>
  <li>之后浏览器每次请求自动带上Cookie: JSESSIONID=xxx，容器根据ID找到对应session；</li>
  <li><b>浏览器关闭≠session销毁</b>：Cookie消失了（默认内存Cookie），但服务端session还在直到超时；重新开浏览器会分配新session；</li>
  <li>session 保存在<b>服务器内存</b>，不能存大数据/大量用户数据（分布式场景要放Redis）。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 登录 / 注销标准写法</h4>
<pre class="code"><code>// 登录成功后保存用户信息
HttpSession session = request.getSession();
session.setAttribute("loginUser", user);      // 保存登录用户对象
session.setMaxInactiveInterval(30 * 60);      // 30分钟无操作超时

// 需要登录的资源校验
Object user = request.getSession().getAttribute("loginUser");
if (user == null) {
    response.sendRedirect(request.getContextPath() + "/login.jsp");
    return;
}

// 注销登录
request.getSession().invalidate(); // 销毁整个session
response.sendRedirect(request.getContextPath() + "/login.jsp");</code></pre>

<div class="kp-warn"><b>⚠️ 经典坑：</b>
<ul style="margin:4px 0 0 16px;">
  <li><code>request.getSession()</code> 默认没有session就<b>创建新的</b>；如果只想检查不创建，用 <code>request.getSession(false)</code> 避免"爬虫刷出一堆session"；</li>
  <li>session里存的对象要实现 <code>Serializable</code>（序列化接口），否则集群/持久化会失败；</li>
  <li><b>浏览器禁用Cookie后session失效</b>，解决方案是URL重写 <code>response.encodeURL("/user")</code>。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-setattribute">
<script type="text/html" id="kp-setattribute">
<div class="kp-def"><b>setAttribute(String name, Object value)</b> 是<b>三大域对象（ServletContext/HttpSession/HttpServletRequest）共有的方法</b>，把一个Java对象以键值对形式存入域中，供后续转发/同会话/全局范围内使用。</div>

<h4 style="margin:12px 0 8px;">三个域的 setAttribute 对比</h4>
<table>
<tr><th>域对象</th><th>作用范围</th><th>何时失效</th><th>典型场景</th></tr>
<tr><td><code>request.setAttribute(k,v)</code></td><td>一次请求（forward有效，redirect失效）</td><td>响应返回</td><td>Servlet查完数据传给JSP展示（最常用）</td></tr>
<tr><td><code>session.setAttribute(k,v)</code></td><td>一次会话（同浏览器的多次请求）</td><td>超时/invalidate</td><td>登录用户、购物车、验证码</td></tr>
<tr><td><code>application.setAttribute(k,v)</code></td><td>整个应用（所有用户共享）</td><td>应用关闭</td><td>在线人数、全局配置</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 三个配套方法</h4>
<ul>
  <li><b>存</b>：<code>setAttribute("key", value)</code> —— key相同会覆盖（类似Map.put）；</li>
  <li><b>取</b>：<code>getAttribute("key")</code> —— 返回 <code>Object</code>，必须强转；不存在返回 <code>null</code>；</li>
  <li><b>删</b>：<code>removeAttribute("key")</code> —— 手动删除（不用等域销毁）。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 最小作用域原则（非常重要！）</h4>
<pre class="code"><code>// ✅ 正确：Servlet→JSP传数据用request域（生命周期最短，内存及时释放）
request.setAttribute("userList", userList);
request.getRequestDispatcher("/userList.jsp").forward(request, response);

// ❌ 错误：什么都往session里塞
session.setAttribute("userList", userList); // 用户看完列表还占着内存！

// ✅ 登录用户跨页面用session
session.setAttribute("loginUser", user);

// ✅ 全局共享用application（线程安全考虑）
application.setAttribute("onlineCount", count);</code></pre>

<div class="kp-warn"><b>⚠️ 常见错误：</b>
<ul style="margin:4px 0 0 16px;">
  <li><b>setAttribute 后重定向</b>：sendRedirect是新请求，request域丢失！要传数据必须用forward或session/拼接参数；</li>
  <li><b>key 拼写不一致</b>：存的时候"userList"，取的时候"users"，返回null但不报错——建议用常量 <code>public static final String USER_LIST = "userList";</code>；</li>
  <li>getAttribute返回Object忘记强转：编译不报错，运行 <code>ClassCastException</code>。</li>
</ul>
</div>
</script>
</script>

<script type="text/html" id="kp-tag-page">
<div class="kpcard-head"><span class="kptag">🏷️</span><span class="kpname">&lt;%@ page %&gt; 指令（JSP 页面声明）</span><span class="cat" style="background:#fce7f3;color:#bf3989;">标签/表达式</span></div>
<div class="kpcard-body">
  <div class="def">
    <h4>📖 定义</h4>
    <p><code class="hl">&lt;%@ page ... %&gt;</code> 是 JSP 的<b>页面指令</b>（page directive），用来告诉 JSP 引擎当前页面的 MIME 类型、字符编码、导入哪些 Java 类、是否启用会话等。它必须放在 JSP 文件<b>最顶部</b>（先于任何 HTML/脚本输出），一个 JSP 可以有多条 page 指令，但同属性只能出现一次（import 除外）。</p>
  </div>

  <div class="syn">
    <h4>📝 标准写法</h4>
<pre><code><span class="tag">&lt;%@ page </span><span class="attr">contentType</span>=<span class="str">"text/html;charset=UTF-8"</span> <span class="attr">language</span>=<span class="str">"java"</span><span class="tag">%&gt;</span>
<span class="tag">&lt;%@ page </span><span class="attr">import</span>=<span class="str">"java.util.List, com.example.bookadmin.entity.Book"</span><span class="tag">%&gt;</span>
<span class="tag">&lt;%@ page </span><span class="attr">session</span>=<span class="str">"true"</span> <span class="attr">errorPage</span>=<span class="str">"error.jsp"</span><span class="tag">%&gt;</span></code></pre>
  </div>

  <div class="grid2">
    <div>
      <h4>📊 常用属性一览</h4>
      <table>
        <thead><tr><th>属性</th><th>默认值</th><th>作用</th></tr></thead>
        <tbody>
          <tr><td><code>contentType</code></td><td>text/html;charset=ISO-8859-1</td><td>设置响应 MIME 类型与编码，中文必须写 <b>UTF-8</b></td></tr>
          <tr><td><code>pageEncoding</code></td><td>ISO-8859-1</td><td>JSP 源文件本身的解码编码（中文页面建议与 contentType 一致 UTF-8）</td></tr>
          <tr><td><code>language</code></td><td>java</td><td>脚本语言，目前只能写 java</td></tr>
          <tr><td><code>import</code></td><td>（无）</td><td>导包，唯一可以重复出现的属性；逗号分隔多个类</td></tr>
          <tr><td><code>session</code></td><td>true</td><td>是否自动创建 session 对象；false 则不能直接用 &lt;%=session%&gt;</td></tr>
          <tr><td><code>errorPage</code></td><td>（无）</td><td>当前页抛异常时跳转的错误页</td></tr>
          <tr><td><code>isErrorPage</code></td><td>false</td><td>是否作为错误页，true 才可以使用 exception 内置对象</td></tr>
          <tr><td><code>isELIgnored</code></td><td>false</td><td>是否忽略 EL 表达式 ${}；true 会按原样输出不解析</td></tr>
        </tbody>
      </table>
    </div>
    <div>
      <h4>❌ 高频错误</h4>
      <ul>
        <li><b>漏写 contentType="...;charset=UTF-8"</b>：页面中文全部变成 <b>???</b> 或 <b>å¼ ä¸</b> 乱码，这是最常见的问题。</li>
        <li><b>page 指令放在 HTML 后面</b>：例如先写 <code>&lt;!DOCTYPE html&gt;</code> 再写 page，会导致 contentType 设置无效、仍按 ISO-8859-1 响应。</li>
        <li><b>import 多类时写错分隔符</b>：必须用<b>英文逗号</b>分隔，不能写多条 import 属性（虽然多数容器兼容，但不规范）。</li>
        <li><b>contentType 写成 text/plain</b>：浏览器会把整个页面当纯文本显示，HTML 标签全可见。</li>
        <li><b>同时用 pageEncoding 和 contentType charset 不一致</b>：会产生"编译用 UTF-8 读源文件、响应却按 GBK 写"的混合乱码。</li>
      </ul>
    </div>
  </div>

  <div class="tip">
    <h4>💡 企业实践</h4>
    <p>每个 JSP 的第一行<b>固定模板</b>就写：<code>&lt;%@ page contentType="text/html;charset=UTF-8" language="java" %&gt;</code>，这是中文项目的"起手式"。IDEA 新建 JSP 时会自动插入这行；如果你的 IDEA 默认是 ISO-8859-1，去 <code>Settings → Editor → File Encodings → JSP Files Default encoding</code> 改成 UTF-8，一劳永逸。需要导实体类/List/Map 时再加 <code>&lt;%@ page import="..." %&gt;</code>。</p>
  </div>
</div>
</script>

<script type="text/html" id="kp-webfilter">
<script type="text/html" id="kp-webfilter">
<div class="kp-def"><b>@WebFilter</b> 是过滤器的注册注解，等价于 web.xml 中的 <code>&lt;filter&gt;</code>+<code>&lt;filter-mapping&gt;</code>。容器启动时自动扫描并把实现了 <code>Filter</code> 接口的类注册成过滤器，按路径或Servlet名匹配请求。</div>

<h4 style="margin:12px 0 8px;">拦截规则属性</h4>
<table>
<tr><th>属性</th><th>说明</th><th>典型值</th></tr>
<tr><td><code>value / urlPatterns</code></td><td>按URL路径拦截（最常用）</td><td><code>{"/*"}</code> 拦截所有；<code>{"/user/*"}</code> 拦截user目录</td></tr>
<tr><td><code>servletNames</code></td><td>按Servlet名拦截（需配合@WebServlet的name）</td><td><code>{"LoginServlet"}</code></td></tr>
<tr><td><code>filterName</code></td><td>过滤器名，默认是类全限定名</td><td><code>"encodingFilter"</code></td></tr>
<tr><td><code>initParams</code></td><td>初始化参数</td><td><code>@WebInitParam(name="encoding",value="UTF-8")</code></td></tr>
<tr><td><code>dispatcherTypes</code></td><td>拦截哪种转发方式</td><td>REQUEST/FORWARD/INCLUDE/ERROR/ASYNC</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>urlPatterns 必须写</b>，否则过滤器不拦截任何路径（等于白写）；</li>
  <li><b>拦截所有路径用 /*</b>，不是 /**（Servlet规范里没有**通配，这是新手最容易抄Spring MVC写错的地方）；</li>
  <li><b>多个过滤器同一路径</b>时，执行顺序<b>按类名字母序</b>（注解方式无法像 web.xml 那样用 &lt;filter-mapping&gt; 顺序控制），所以规范做法是类名前缀加01_、02_ 或首字母来控制顺序，如 <code>A_EncodingFilter</code> 最先执行；</li>
  <li>默认只拦截<b>直接请求 REQUEST</b>，forward/include 内部转发不会经过过滤器，需要显式加 <code>dispatcherTypes = {DispatcherType.REQUEST, DispatcherType.FORWARD}</code>。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 企业常见写法</h4>
<pre class="code"><code>@WebFilter(filterName = "encodingFilter", urlPatterns = "/*",
           initParams = @WebInitParam(name = "encoding", value = "UTF-8"))
public class EncodingFilter implements Filter { ... }</code></pre>

<div class="kp-warn"><b>⚠️ 顺序坑：</b>使用注解配置多过滤器时，不要依赖"先写哪个类就先执行"，这不是规范！必须按<b>类名字母序</b>规划。如果项目里过滤器很多（>3个），建议改回 web.xml 配置以明确顺序。</div>
</script>
</script>

<script type="text/html" id="kp-weblistener">
<script type="text/html" id="kp-weblistener">
<div class="kp-def"><b>@WebListener</b> 是监听器的注册注解，等价于 web.xml 的 <code>&lt;listener&gt;&lt;listener-class&gt;...&lt;/listener-class&gt;&lt;/listener&gt;</code>。标注在实现了 ServletContextListener/HttpSessionListener/ServletRequestListener 等监听器接口的类上，容器启动时自动注册。</div>

<h4 style="margin:12px 0 8px;">8种常用监听器接口</h4>
<table>
<tr><th>监听对象</th><th>接口</th><th>监听事件</th><th>典型用途</th></tr>
<tr><td rowspan="2">ServletContext<br/>（应用）</td><td>ServletContextListener</td><td>应用启动/销毁</td><td>初始化全局资源、创建上传目录、加载配置文件、启动定时任务</td></tr>
<tr><td>ServletContextAttributeListener</td><td>application属性增删改</td><td>全局属性变更日志</td></tr>
<tr><td rowspan="3">HttpSession<br/>（会话）</td><td>HttpSessionListener</td><td>session创建/销毁</td><td>统计在线人数</td></tr>
<tr><td>HttpSessionAttributeListener</td><td>session属性增删改</td><td>用户登录/注销记录</td></tr>
<tr><td>HttpSessionBindingListener</td><td>对象绑定/解绑到session</td><td>用户对象绑定时触发逻辑</td></tr>
<tr><td rowspan="2">ServletRequest<br/>（请求）</td><td>ServletRequestListener</td><td>请求开始/结束</td><td>统计请求耗时、请求日志</td></tr>
<tr><td>ServletRequestAttributeListener</td><td>request属性增删改</td><td>调试、追踪数据传递</td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>一个类可以实现多个监听器接口</b>，但企业规范建议<b>一个类只做一件事</b>，职责单一；</li>
  <li>@WebListener <b>没有 value/urlPatterns 属性</b>，写了也没用——监听器是全局注册，按事件自动触发，不需要路径匹配；</li>
  <li><b>ServletContextListener.contextInitialized</b> 是整个Web应用最早执行的代码，比任何Servlet/Filter的init都早，是做"应用启动初始化"的最佳位置。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 启动初始化示例</h4>
<pre class="code"><code>@WebListener
public class AppInitListener implements ServletContextListener {
    public void contextInitialized(ServletContextEvent sce) {
        // 应用启动时执行：创建上传目录、加载配置、连接池初始化
        String uploadPath = sce.getServletContext().getRealPath("/upload");
        new File(uploadPath).mkdirs();
    }
    public void contextDestroyed(ServletContextEvent sce) {
        // 应用关闭时：释放资源、关连接池、存盘
    }
}</code></pre>

<div class="kp-warn"><b>⚠️ 注意：</b>contextDestroyed 在服务器正常关闭时调用，<b>强制 kill 进程不会触发</b>，重要数据不能只在destroy里存盘，要做定时刷盘。</div>
</script>
</script>

<script type="text/html" id="kp-webservlet">
<script type="text/html" id="kp-webservlet">
<div class="kp-def"><b>@WebServlet</b> 是 Jakarta Servlet 6.0 提供的<b>类级注解</b>，用于把一个普通 Java 类注册为 Servlet，替代传统 web.xml 里 <code>&lt;servlet&gt;</code>+<code>&lt;servlet-mapping&gt;</code> 配置。加了该注解的类必须继承 <code>HttpServlet</code>，容器启动时会自动扫描并注册。</div>

<h4 style="margin:12px 0 8px;">常用属性对照表</h4>
<table>
<tr><th>属性</th><th>类型</th><th>说明</th><th>示例</th></tr>
<tr><td><code>value / urlPatterns</code></td><td>String[]</td><td>访问路径（必写），支持多路径映射</td><td><code>@WebServlet("/login")</code></td></tr>
<tr><td><code>name</code></td><td>String</td><td>Servlet名，等价于 <code>&lt;servlet-name&gt;</code>，默认是类全限定名</td><td><code>name="LoginServlet"</code></td></tr>
<tr><td><code>initParams</code></td><td>@WebInitParam[]</td><td>初始化参数</td><td><code>@WebInitParam(name="encoding",value="UTF-8")</code></td></tr>
<tr><td><code>loadOnStartup</code></td><td>int</td><td>启动优先级，&gt;=0 时容器启动即实例化，数字越小越先加载；默认-1表示首次访问才创建</td><td><code>loadOnStartup=1</code></td></tr>
<tr><td><code>asyncSupported</code></td><td>boolean</td><td>是否支持异步Servlet（长轮询/SSE用）</td><td><code>asyncSupported=true</code></td></tr>
</table>

<h4 style="margin:14px 0 8px;">🔑 要点</h4>
<ul>
  <li><b>路径必须以 / 开头</b>，否则Tomcat启动直接抛 <code>IllegalArgumentException: Invalid &lt;url-pattern&gt;</code>；</li>
  <li><b>value 和 urlPatterns 二选一即可</b>，单独写 <code>@WebServlet("/xx")</code> 等价于 <code>@WebServlet(value="/xx")</code>；要同时写多路径必须用 <code>urlPatterns={"/a","/b"}</code>；</li>
  <li><b>同一个路径不能映射多个Servlet</b>，否则启动报错"映射重复"；</li>
  <li><b>注解与 web.xml 共存</b>时，<code>web.xml</code> 中的 <code>metadata-complete="true"</code> 会让容器忽略注解扫描，加快启动。</li>
</ul>

<h4 style="margin:14px 0 8px;">💡 多种写法</h4>
<pre class="code"><code>// 1) 最简写法（最常用）
@WebServlet("/login")
public class LoginServlet extends HttpServlet { ... }

// 2) 多路径映射：同一段逻辑可通过多个URL访问
@WebServlet(urlPatterns = {"/login", "/doLogin", "/user/login"})

// 3) 带初始化参数（替代 web.xml 的 init-param）
@WebServlet(value = "/upload",
    initParams = {
        @WebInitParam(name = "maxFileSize", value = "10485760"),
        @WebInitParam(name = "encoding",    value = "UTF-8")
    },
    loadOnStartup = 0
)</code></pre>

<div class="kp-warn"><b>⚠️ 常见坑：</b>
<ul style="margin:4px 0 0 16px;">
  <li>漏写 <code>/</code>：<code>@WebServlet("login")</code> 启动报错；</li>
  <li>类没继承 <code>HttpServlet</code>：注解无效，404；</li>
  <li>包没放在 <code>src/main/java</code> 下或 Tomcat 版本太低（Tomcat 10+才支持 jakarta.servlet 6.0），扫描不到。</li>
</ul>
</div>
</script>
</script>

<script>

function installWatermarkAndCopyright(){
  var watermark = document.getElementById('__wm__');
  var copyright = document.getElementById('__cr__');

  // ============ 水印（浅灰色fixed铺满视口，随滚动始终可见，不依赖页面高度）============
  if (typeof SHOW_WATERMARK !== 'undefined' && SHOW_WATERMARK) {
    if (watermark) watermark.remove();
    watermark = document.createElement('div');
    watermark.id = '__wm__';
    document.body.appendChild(watermark);

    var text = (typeof WATERMARK_TEXT !== 'undefined') ? WATERMARK_TEXT : '';
    var charCount = text.length || 10;
    var fontSize = 16;
    var unitW = fontSize * 1.05;
    var textPixelWidth = charCount * unitW;
    var stepX = Math.ceil(textPixelWidth * 1.8);     // 水平步长=字宽×1.8，16字也绝对不重叠
    var stepY = 160;                                  // 垂直步长
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    // 多铺一圈，视口滚动resize时不出现空白
    var cols = Math.ceil(vw / stepX) + 3;
    var rows = Math.ceil(vh / stepY) + 3;

    watermark.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:9998;pointer-events:none;overflow:hidden;';
    var frag = document.createDocumentFragment();
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var t = document.createElement('span');
        t.textContent = text;
        // 奇数行错开半个步长，形成菱形交错
        var offsetX = (r % 2 === 0) ? 0 : stepX / 2;
        t.style.cssText = 'position:absolute;'
          + 'left:' + (c * stepX + offsetX - stepX) + 'px;'
          + 'top:'  + (r * stepY - stepY) + 'px;'
          + 'font-size:' + fontSize + 'px;'
          + 'color:#a8a8a8;'                  // 浅灰色
          + 'opacity:0.07;'                   // 极淡，仅隐约可见
          + 'font-weight:400;'
          + 'letter-spacing:2px;'
          + 'white-space:nowrap;'
          + 'transform:rotate(-25deg);'
          + 'transform-origin:left top;'
          + 'user-select:none;';
        frag.appendChild(t);
      }
    }
    watermark.appendChild(frag);
  } else {
    if (watermark) { watermark.remove(); watermark = null; }
  }

  // ============ 版权信息条（追加到 main 末尾）============
  if (typeof SHOW_COPYRIGHT !== 'undefined' && SHOW_COPYRIGHT) {
    if (copyright) copyright.remove();
    copyright = document.createElement('div');
    copyright.id = '__cr__';
    copyright.style.cssText = 'text-align:center;padding:22px 20px;color:#8a8f98;font-size:12px;border-top:1px solid #eaecef;background:#f6f8fa;margin-top:40px;line-height:1.9;clear:both;';
    var main = document.getElementById('main');
    var projName = document.title.replace(' - JSP交互教学课件','').replace(' · 分步向导','');
    copyright.innerHTML = '<div style="font-weight:600;color:#57606a;margin-bottom:4px;letter-spacing:0.5px;">'
      + ((typeof COPYRIGHT_TEXT !== 'undefined') ? COPYRIGHT_TEXT : '')
      + '</div>'
      + '<div>项目：<b style="color:#0969da;">' + projName + '</b> · 课时：4×40分钟=160分钟 · 适用环境：JDK 17 + IDEA 2024.1 + Tomcat 10.1.59 + Maven 3.9+</div>';
    if (main) main.appendChild(copyright);
    else document.body.appendChild(copyright);
  } else {
    if (copyright) { copyright.remove(); copyright = null; }
  }
}
window.addEventListener('resize', function(){ installWatermarkAndCopyright(); });

var _origRender = render;
render = function(){
  try { _origRender.apply(this, arguments); }
  catch(e){ console.error(e); }
  // 切换步骤/知识点后面板展开可能改变布局，重新铺设一次
  setTimeout(installWatermarkAndCopyright, 100);
};

// 首次渲染
render();

</script>

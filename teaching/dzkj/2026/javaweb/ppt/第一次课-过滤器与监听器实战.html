<style>

.brand{display:flex;align-items:center;gap:12px;min-width:270px;}

.workbench{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(360px,1fr);

.kchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:999px;

.kchip.on{background:#1b2430;border-color:#1b2430;color:#fff;font-weight:700;}
.kp-body{padding:16px 18px 24px;overflow:auto;flex:1 1 auto;}

.kpcard-head .cat{margin-left:auto;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;}
.kpcard-body{padding:14px 16px 18px;font-size:13.5px;color:#2c3540;}
.kp-def{background:#f7fafd;border:1px solid #e6eef7;border-left:4px solid #4a90d9;

.kpcard h5{margin:16px 0 8px;font-size:13.5px;color:#16202c;display:flex;align-items:center;gap:7px;

.kpcard h5:first-of-type{margin-top:6px;}
.kpcard ul,.kpcard ol{margin:6px 0;padding-left:20px;}
.kpcard li{margin:4px 0;}
.kpcard b{color:#101820;}
table.kpt{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:12.8px;}
table.kpt th{background:#f4f7fb;color:#2b3542;text-align:left;padding:7px 10px;
  border:1px solid #e3eaf3;font-weight:700;}

table.kpt tr:nth-child(even) td{background:#fbfcfe;}
table.kpt code{background:#eef4fb;padding:1px 5px;border-radius:4px;font-size:12px;color:#0a3d78;}
pre.kpcode{background:#f8fafc;border:1px solid #e5ebf3;border-radius:8px;padding:11px 13px;
  overflow-x:auto;font-size:12.6px;line-height:1.7;color:#1f2937;margin:8px 0 12px;white-space:pre;}
pre.kpcode .c-str{color:#0a3069;}

pre.kpcode .c-jsp{color:#8250df;font-weight:700;}
pre.kpcode .c-el{color:#8250df;font-weight:700;}
pre.kpcode .c-tag{color:#116329;font-weight:700;}
.tip{background:#e8f7ee;border:1px solid #bfe3cd;border-left:4px solid #1a7f37;

.warn{background:#fff8ec;border:1px solid #f6e3c4;border-left:4px solid #bc4c00;
  border-radius:7px;padding:9px 13px;margin:10px 0;font-size:13px;color:#6b3f00;}
.std{background:#f4edff;border:1px solid #e0d1ff;border-left:4px solid #8250df;
  border-radius:7px;padding:9px 13px;margin:10px 0;font-size:13px;color:#4a2e87;}
.kplink{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:6px;

.info-section p{font-size:13.5px;color:#3c4757;margin:8px 0;}
.info-section ul,.info-section ol{padding-left:22px;}

/* ============================================================
   工具函数
   ============================================================ */
const state = { step:0, selKp:null };
const srcCache = {};

function $(id){return document.getElementById(id);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function toast(msg, type){
  const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (type||'ok');
  clearTimeout(t._tm); t._tm = setTimeout(()=>{t.className='toast';},2000);
}

function getSource(id){
  if(srcCache[id]) return srcCache[id];
  const el = document.getElementById(id);
  let raw = el ? el.textContent : '';
  // 去除首尾空行
  raw = raw.replace(/\r/g,'').replace(/^\n+/,'').replace(/\n+$/,'');
  const lines = raw.split('\n');
  srcCache[id] = lines;
  return lines;
}

function copyText(text, btn){
  if(!TEACHER_MODE){ toast('🔒 学生模式下禁止复制代码，请手动输入以获得最佳学习效果','err'); return; }
  navigator.clipboard.writeText(text).then(()=>{
    toast('✅ 代码已复制到剪贴板','ok');
    if(btn){ const o=btn.textContent; btn.textContent='✅ 已复制'; setTimeout(()=>btn.textContent=o,1200);}
  }).catch(()=>{
    // fallback
    const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    toast('✅ 代码已复制','ok');
  });
}

/* ============================================================
   语法高亮（自研，白底GitHub Light风格）
   ============================================================ */
function hlJava(s, isDir){
  const KW = ['abstract','assert','boolean','break','byte','case','catch','char','class','const','continue','default','do','double','else','enum','extends','final','finally','float','for','goto','if','implements','import','instanceof','int','interface','long','native','new','package','private','protected','public','return','short','static','strictfp','super','switch','synchronized','this','throw','throws','transient','try','void','volatile','while',
             'true','false','null',
             'String','Integer','Boolean','Double','Float','Long','Object','System','out','println','print','request','response','session','application','pageContext','config','out','page','exception'];
  let out='',buf='',i=0,inStr=null;
  const flush=()=>{if(buf){out+='<span class="tok-jspcode">'+esc(buf)+'</span>';buf='';}};
  const flushKw=()=>{
    if(!buf){return;}
    if(/^\d/.test(buf)||/^0x[\da-f]+$/i.test(buf)){out+='<span class="tok-num">'+esc(buf)+'</span>';}
    else if(KW.indexOf(buf)>=0){out+='<span class="tok-kw">'+esc(buf)+'</span>';}
    else out+='<span class="tok-jspcode">'+esc(buf)+'</span>';
    buf='';
  };
  while(i<s.length){
    const c=s[i];
    if(inStr){
      buf+=c;
      if(c===inStr&&s[i-1]!=='\\'){flush();inStr=null;}
      i++;continue;
    }
    if(c==='"'||c==="'"){flushKw();buf+=c;inStr=c;i++;continue;}
    if(c==='/'&&s[i+1]==='/'){flushKw();const e=s.indexOf('\n',i);out+='<span class="tok-cmt">'+esc(e<0?s.slice(i):s.slice(i,e))+'</span>';if(e<0)return out;i=e;continue;}
    if(c==='/'&&s[i+1]==='*'){flushKw();const e=s.indexOf('*/',i+2);const end=e<0?s.length:e+2;out+='<span class="tok-cmt">'+esc(s.slice(i,end))+'</span>';i=end;continue;}
    if(/[A-Za-z_$]/.test(c)){buf+=c;i++;continue;}
    if(/\d/.test(c)&&(!buf||/[\d.]$/.test(buf))){buf+=c;i++;continue;}
    if(/[\w.]/.test(c)){buf+=c;i++;continue;}
    flushKw();
    if(/\s/.test(c)){buf+=c;flush();i++;continue;}
    out+='<span class="tok-punc">'+esc(c)+'</span>';i++;
  }
  if(inStr){out+='<span class="tok-str">'+esc(buf)+'</span>';}else{flushKw();}
  return out;
}
function renderJsp(m){
  const open=m.slice(0,3); let rest=m.slice(3,-2); if('@!='.indexOf(m[2])>=0){return '<span class="tok-dir">'+esc(open)+'</span>'+hlJava(rest,open==='<%@')+'<span class="tok-dir">%&gt;</span>';}
  return '<span class="tok-jsp">'+esc(open)+'</span>'+hlJava(rest,false)+'<span class="tok-jsp">%&gt;</span>';
}
function renderTag(t){
  const m=t.match(/^<\/?([a-zA-Z][\w:-]*)/);if(!m)return esc(t);
  const rest=t.slice(m[0].length);
  const re2=/("[^"]*"|'[^']*')|([a-zA-Z_:][\w:.-]*)(\s*=\s*)|(\/?>)|(\s+)|([^\s"'>=/]+)/g;
  let out2='',last=0,mm;
  while((mm=re2.exec(rest))){
    out2+=esc(rest.slice(last,mm.index));
    if(mm[1])out2+='<span class="tok-str">'+esc(mm[1])+'</span>';
    else if(mm[2])out2+='<span class="tok-attr">'+esc(mm[2])+'</span><span class="tok-punc">'+esc(mm[3])+'</span>';
    else if(mm[4])out2+='<span class="tok-punc">'+esc(mm[4])+'</span>';
    else if(mm[5])out2+=mm[5];
    else out2+=esc(mm[6]);
    last=re2.lastIndex;
  }
  out2+=esc(rest.slice(last));
  return '<span class="tok-tag">'+esc(m[0])+'</span>'+out2;
}
function tokenizeText(text){
  let html='',buf='',i=0,pending=null;
  const flush=()=>{if(buf){html+=esc(buf);buf='';}};
  while(i<text.length){
    const c=text[i];
    if(c==='<'&&text.startsWith('<!--',i)){const e=text.indexOf('-->',i+4);const end=e>=0?e+3:text.length;flush();html+='<span class="tok-cmt">'+esc(text.slice(i,end))+'</span>';i=end;continue;}
    if(c==='<'&&text.startsWith('<%',i)){
      const e=text.indexOf('%>',i+2);
      if(e<0){let open='<%',body=text.slice(i+2);if('@!='.indexOf(body[0])>=0){open='<%'+body[0];body=body.slice(1);}flush();const cls=(open==='<%@')?'tok-dir':'tok-jsp';html+='<span class="'+cls+'">'+esc(open)+'</span>'+hlJava(body,open==='<%@');pending={cls,dir:open==='<%@'};i=text.length;continue;}
      flush();html+=renderJsp(text.slice(i,e+2));i=e+2;continue;
    }
    if(c==='$'&&text[i+1]==='{'){const e=text.indexOf('}',i+2);if(e>=0){flush();html+='<span class="tok-el">'+esc(text.slice(i,e+1))+'</span>';i=e+1;continue;}}
    if(c==='<'&&(text[i+1]==='/'||/[A-Za-z]/.test(text[i+1]||''))){
      let j=i+1,q=null;while(j<text.length){const ch=text[j];if(q){if(ch===q)q=null;}else if(ch==='"'||ch==="'"){q=ch;}else if(ch==='>'){break;}j++;}
      if(j<text.length){flush();html+=renderTag(text.slice(i,j+1));i=j+1;continue;}
    }
    if(c==='"'||c==="'"){const e=text.indexOf(c,i+1);if(e>=0){flush();html+='<span class="tok-str">'+esc(text.slice(i,e+1))+'</span>';i=e+1;continue;}}
    buf+=c;i++;
  }
  flush();return{html,pending};
}
function commentMask(lines){
  const mask=new Array(lines.length).fill(false);let inC=false;
  for(let i=0;i<lines.length;i++){const t=lines[i].trim();if(!inC){if(t.indexOf('<%--')===0){inC=true;mask[i]=true;if(t.indexOf('--%>',4)>=0)inC=false;}}else{mask[i]=true;if(t.slice(-4)==='--%>')inC=false;}}
  return mask;
}
function highlightCode(lines){
  const mask=commentMask(lines);const res=[];const st={open:false,cls:'tok-jsp',dir:false};
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(mask[i]){res.push('<span class="tok-cmt">'+esc(line)+'</span>');continue;}
    let seg=line,html='';
    if(st.open){
      const e=seg.indexOf('%>');
      if(e>=0){html+='<span class="'+st.cls+'">'+hlJava(seg.slice(0,e),st.dir)+'</span><span class="'+st.cls+'">%&gt;</span>';seg=seg.slice(e+2);st.open=false;}
      else{html+='<span class="'+st.cls+'">'+hlJava(seg,st.dir)+'</span>';res.push(html||'&nbsp;');continue;}
    }
    const r=tokenizeText(seg);html+=r.html;if(r.pending){st.open=true;st.cls=r.pending.cls;st.dir=r.pending.dir;}
    res.push(html||'&nbsp;');
  }
  return res;
}

/* ============================================================
   标记解析
   ============================================================ */
function resolveMarks(lines, marks){
  const out=[];
  (marks||[]).forEach(m=>{
    if(!m || !m.k) return;           // 缺k的标记直接跳过，避免渲染中断
    let s=-1;for(let i=0;i<lines.length;i++){if(lines[i].indexOf(m.from)>=0){s=i;break;}}
    if(s<0)return;let e=s;
    if(m.to){for(let i=s;i<lines.length;i++){if(lines[i].indexOf(m.to)>=0){e=i;break;}}}
    e+=(m.plus||0);if(e>lines.length-1)e=lines.length-1;
    out.push({s,e,k:m.k});
  });
  return out;
}

function kpStepIndex(kp){
  const steps=COURSE.steps;
  for(let i=0;i<steps.length;i++){if(steps[i].type==='code'&&(steps[i].kps||[]).indexOf(kp)>=0)return i;}
  return -1;
}
function kpList(){
  const seen=[],out=[];
  COURSE.steps.forEach(s=>{(s.kps||[]).forEach(k=>{if(!COURSE.KPMETA[k])return;if(seen.indexOf(k)<0){seen.push(k);out.push(k);}});});
  return out;
}

  COURSE.steps.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='stepchip'+(i===state.step?' active':'')+(i<state.step?' done':'');

  return '<div class="kpcard"><div class="kpcard-head" style="background:'+cat.bg+'"><span class="ic">'+cat.icon+'</span><span class="tt">'+meta.title+'</span><span class="cat" style="color:'+cat.color+';background:#fff;border:1px solid '+cat.color+'33">'+cat.name+'</span></div><div class="kpcard-body">'+wrap.innerHTML+'</div></div>';
}

  chips.innerHTML=kps.map(k=>{
    const meta=COURSE.KPMETA[k],cat=COURSE.categories[meta.cat];
    return '<button class="kchip'+(state.selKp===k?' on':'')+'" data-kp="'+k+'">'+cat.icon+' '+meta.title+'</button>';
  }).join('');
  chips.querySelectorAll('.kchip').forEach(b=>{b.onclick=()=>{state.selKp=b.dataset.kp;renderKpPanel();};});
  const sel=state.selKp;
  if(sel&&kps.indexOf(sel)>=0){
    const idx=kps.indexOf(sel);
    body.innerHTML=kpCard(sel);body.scrollTop=0;
    $('kpPrev').disabled=false;$('kpNext').disabled=false;
    $('kpPrev').dataset.idx=idx;$('kpNext').dataset.idx=idx;
    document.querySelectorAll('.cl.clickable').forEach(el=>{el.classList.toggle('active',(el.dataset.k||'').split(' ').indexOf(sel)>=0);});
  }else{
    body.innerHTML='<div class="kp-empty"><span class="big">👈</span>点击左侧<b>带图标的代码行</b><br>这里就会显示对应的完整知识点<br><br><span style="color:#b8c2cf;font-size:12.5px;">也可以点上方标签直接查看</span></div>';
    $('kpPrev').disabled=true;$('kpNext').disabled=true;
    document.querySelectorAll('.cl.clickable').forEach(el=>el.classList.remove('active'));
  }
}

/* ============================================================
   渲染代码步骤
   ============================================================ */
function renderCodeStep(s,host){
  const lines=getSource(s.src);const marks=resolveMarks(lines,s.marks);
  const lineK=lines.map((_,i)=>marks.filter(m=>i>=m.s&&i<=m.e).map(m=>m.k));
  const htmls=highlightCode(lines);
  const catsInStep=[];(s.kps||[]).forEach(k=>{const m=COURSE.KPMETA[k];if(!m||!m.cat)return;const c=m.cat;if(catsInStep.indexOf(c)<0)catsInStep.push(c);});
  const legend=catsInStep.map(c=>{const cat=COURSE.categories[c];return '<span class="lg" style="border-color:'+cat.color+'33"><b>'+cat.icon+'</b>'+cat.name+'</span>';}).join('')+'<span class="lg" style="border-color:#d9e0ea"><b>▎</b>左侧色条 = 该行含知识点</span>';

  let codeHtml='';
  htmls.forEach((h,i)=>{
    // 过滤掉无效 k（KPMETA 中不存在的）
    const ks=(lineK[i]||[]).filter(k=>!!COURSE.KPMETA[k]);
    const hasK=ks.length>0;
    const mainCat=hasK?COURSE.KPMETA[ks[0]].cat:'';
    const cat=mainCat?COURSE.categories[mainCat]:null;
    const icon=cat?cat.icon:'';
    codeHtml+='<div class="cl'+(hasK?' clickable marked k-'+mainCat:'')+'"'+(hasK?' data-k="'+ks.join(' ')+'" data-line="'+(i+1)+'"':'')+'><span class="ic">'+icon+'</span><span class="ln">'+(i+1)+'</span><code class="src">'+h+'</code></div>';
  });

  const guideHtml=s.guide?('<div class="guide-box"><h4>🧭 本步操作指引</h4><ol>'+s.guide.map(g=>'<li>'+g+'</li>').join('')+'</ol></div>'):'';

  host.innerHTML=
    '<div class="card"><div class="step-head"><span class="step-kind code">'+s.kind+'</span><div><h2 class="step-title">'+s.title+'</h2><div class="step-sub">'+(s.sub||'')+'</div></div><div class="meta"><span class="pill file">📄 '+s.file+'</span><span class="pill time">⏱ '+(s.dur||'')+'</span><span class="pill">🧩 '+((s.kps||[]).filter(k=>!!COURSE.KPMETA[k]).length)+' 个知识点</span></div></div></div>'+
    '<div class="workbench"><div class="left-col">'+guideHtml+
      '<div class="code-panel"><div class="code-head"><div class="filedot"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="code-file">'+s.file+'<small>'+s.fileNote+'</small></div><div class="codeacts"><button class="mini-btn" id="btnCopy"'+(TEACHER_MODE?'':' disabled')+'>📋 复制代码</button><button class="mini-btn" id="btnClear">✖ 取消选中</button></div></div>'+
      '<div class="legend">'+legend+'</div><div class="code-body" id="codeBody">'+codeHtml+'</div></div></div>'+
      '<aside class="kp-panel"><div class="kp-head"><span class="t">📖 知识点解析</span><span class="hint">点左侧代码行 → 看完整讲解</span><div class="kp-nav"><button id="kpPrev" disabled>◀ 上一个</button><button id="kpNext" disabled>下一个 ▶</button></div></div><div class="kp-chips" id="kpChips"></div><div class="kp-body" id="kpBody"></div></aside></div>'+
      navRow();

  host.querySelectorAll('.cl.clickable').forEach(el=>{
    el.onclick=()=>{const ks=(el.dataset.k||'').split(' ');state.selKp=ks[0];renderKpPanel();if(el.scrollIntoView)el.scrollIntoView({block:'nearest'});};
  });
  $('btnClear').onclick=()=>{state.selKp=null;renderKpPanel();};
  $('btnCopy').onclick=(e)=>{copyText(lines.join('\n'),e.currentTarget);};
  $('kpPrev').onclick=()=>{const kps=s.kps||[];let i=kps.indexOf(state.selKp);if(i<0)i=0;state.selKp=kps[(i-1+kps.length)%kps.length];renderKpPanel();};
  $('kpNext').onclick=()=>{const kps=s.kps||[];let i=kps.indexOf(state.selKp);if(i<0)i=-1;state.selKp=kps[(i+1)%kps.length];renderKpPanel();};
  bindNav();
  renderKpPanel();
}

function navRow(){
  const i=state.step,total=COURSE.steps.length;
  return '<div class="navrow"><button id="navPrev"'+(i<=0?' disabled':'')+'>◀ 上一步</button><button id="navNext" class="primary"'+(i>=total-1?' disabled':'')+'>下一步 ▶</button></div>';
}
function bindNav(){
  const pv=$('navPrev'),nx=$('navNext');
  if(pv)pv.onclick=()=>{if(state.step>0){state.step--;state.selKp=null;render();window.scrollTo({top:0,behavior:'smooth'});}};
  if(nx)nx.onclick=()=>{if(state.step<COURSE.steps.length-1){state.step++;state.selKp=null;render();window.scrollTo({top:0,behavior:'smooth'});}};
}

/* ============================================================
   渲染信息步骤
   ============================================================ */
function renderInfoStep(s,host){
  const tplId = s.tpl && s.tpl.startsWith('tpl-') ? s.tpl : 'tpl-'+s.tpl;
  const tpl=$(tplId);const inner=tpl?tpl.innerHTML:'<p>内容缺失</p>';
  host.innerHTML='<div class="card"><div class="step-head"><span class="step-kind '+(s.kind==='环境准备'?'env':s.kind==='行业标准'?'std':'')+'">'+s.kind+'</span><div><h2 class="step-title">'+s.title+'</h2><div class="step-sub">'+(s.sub||'')+'</div></div></div><div class="info-section">'+inner+'</div></div>'+navRow();
  bindNav();
  if(s.sumGrid){
    const grid=document.getElementById(s.sumGrid);
    if(grid){
      const wrap=grid.previousElementSibling;
      if(wrap){const h=wrap.querySelector('h4');if(h)h.textContent='📚 第一次课 · 知识点全景（共 '+kpList().length+' 个，点击卡片可跳回对应代码位置）';}
      grid.innerHTML=kpList().map(k=>{
        const meta=COURSE.KPMETA[k],cat=COURSE.categories[meta.cat];
        return '<div class="kitem" data-kp="'+k+'"><span class="ic">'+cat.icon+'</span><div><div class="kt">'+meta.title+'</div><div class="kc">'+cat.name+' ｜ 位于步骤 '+(kpStepIndex(k)+1)+'</div></div></div>';
      }).join('');
      grid.querySelectorAll('.kitem').forEach(el=>{el.onclick=()=>{const kp=el.dataset.kp;const si=kpStepIndex(kp);if(si<0)return;state.step=si;state.selKp=kp;render();setTimeout(()=>{const chip=document.querySelector('.kchip.on');if(chip)chip.scrollIntoView({block:'center',behavior:'smooth'});},60);};});
    }
  }
}

/* ============================================================
   主渲染
   ============================================================ */
function render(){
  renderRail();
  const stage=$('stage');
  const s=COURSE.steps[state.step];
  if(s.type==='code')renderCodeStep(s,stage);else renderInfoStep(s,stage);
  // 更新教师模式显示
  $('tmode').textContent=TEACHER_MODE?'✅ 教师模式：开启':'🛡️ 教师模式：关闭';
  $('tmode').className='tmode'+(TEACHER_MODE?' on':'');
  document.body.classList.toggle('student-mode',!TEACHER_MODE);
}

/* ============================================================
   学生模式复制拦截
   ============================================================ */
document.addEventListener('contextmenu',e=>{if(!TEACHER_MODE){e.preventDefault();toast('🔒 学生模式下禁止右键菜单','warn');}});
document.addEventListener('dragstart',e=>{if(!TEACHER_MODE)e.preventDefault();});

document.addEventListener('cut',e=>{if(!TEACHER_MODE)e.preventDefault();});
document.addEventListener('keydown',e=>{
  if(TEACHER_MODE)return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&(k==='c'||k==='a'||k==='s'||k==='p'||k==='u')){e.preventDefault();toast('🔒 学生模式下该快捷键已禁用','warn');}
  if(k==='f12'||(e.ctrlKey&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))){e.preventDefault();toast('🔒 学生模式下禁止打开开发者工具','warn');}

document.addEventListener('mouseup',()=>{if(!TEACHER_MODE)window.getSelection().removeAllRanges();});
if(!TEACHER_MODE&&navigator.clipboard){
  navigator.clipboard.writeText=()=>Promise.reject('student mode');
}

/* ============ 信息步骤模板 ============ */
</script>

<div class="tip"><b>💡 WEB-INF 目录为什么安全？</b>
Tomcat 对 <code>WEB-INF</code> 目录下的资源做了<b>特殊保护</b>：浏览器直接访问会返回404，但服务器内部通过 Servlet 的 <code>getRequestDispatcher()</code> 转发可以访问。后台页面、配置文件、敏感JSP都应该放在WEB-INF下，避免用户绕过登录直接输入URL访问。</div>

<h3>🔑 分包原则（企业规范）</h3>
<table class="envt">

<tr><td><code>com.example.bookadmin.filter</code></td><td>过滤器（拦截处理）</td></tr>
<tr><td><code>com.example.bookadmin.listener</code></td><td>监听器（事件监听）</td></tr>
<tr><td><code>com.example.bookadmin.service</code></td><td>业务逻辑层（后续JDBC章节加）</td></tr>
<tr><td><code>com.example.bookadmin.dao</code></td><td>数据访问层（后续JDBC章节加）</td></tr>
<tr><td><code>com.example.bookadmin.entity</code></td><td>实体类/JavaBean</td></tr>
<tr><td><code>com.example.bookadmin.util</code></td><td>工具类（DB工具、加密等）</td></tr>
</table>

<h3>⚠️ 注意：</h3>
<ul>
<li>Servlet、Filter、Listener 类都必须放在 <b>src/main/java</b> 下（不能放在webapp里）；</li>
<li>包名必须与目录结构一致，否则Tomcat扫描不到@WebServlet/@WebFilter/@WebListener注解；</li>
<li>包名全部小写（Java命名规范），类名大驼峰。</li>
</ul>

<h3>📐 编码规范与易错点</h3>

<h4>一、Servlet 编码规范</h4>
<table class="envt">
<tr><th>规范项</th><th>正确示例</th><th>错误示例</th></tr>
<tr><td>类命名</td><td><code>LoginServlet</code>、<code>EncodingFilter</code>、<code>AppContextListener</code></td><td>loginServlet、login、loginservlet（小写开头或无语义）</td></tr>
<tr><td>包命名</td><td><code>com.example.bookadmin.filter</code></td><td>com.example.Filter、Filter（大写/无包）</td></tr>
<tr><td>URL路径</td><td><code>@WebServlet("/login")</code></td><td><code>@WebServlet("login")</code>（少/）、<code>@WebServlet("/Login")</code>（大写开头）</td></tr>
<tr><td>重定向路径</td><td><code>sendRedirect(req.getContextPath()+"/index")</code></td><td><code>sendRedirect("/index")</code>（少项目名）</td></tr>
<tr><td>导包</td><td><code>import jakarta.servlet.*;</code></td><td><code>import javax.servlet.*;</code>（Tomcat10不支持javax）</td></tr>
</table>

<h4>二、8 个高频错误（课堂统计 Top 8）</h4>
<div class="err-list">
<div class="err-item">
<span class="err-no">1</span>
<div><b>导错包：javax.servlet 代替 jakarta.servlet</b><br>
<span class="err-why">原因：Tomcat 10开始把包名从javax重命名为jakarta；老教材/Tomcat9教程仍用javax，IDEA自动导入可能选错包。</span><br>
<span class="err-fix">✅ 修复：所有import必须是 <code>jakarta.servlet.xxx</code>；如果发现是javax，立即删掉重新导包。</span></div>
</div>
<div class="err-item">
<span class="err-no">2</span>
<div><b>@WebServlet路径少了前导斜杠</b><br>
<span class="err-why">原因：<code>@WebServlet("login")</code> 启动报错"Invalid url-pattern"。</span><br>
<span class="err-fix">✅ 修复：必须写成 <code>@WebServlet("/login")</code>，以 / 开头。</span></div>
</div>
<div class="err-item">
<span class="err-no">3</span>
<div><b>LoginFilter拦截了登录页本身导致重定向死循环</b><br>
<span class="err-why">原因：urlPatterns="/*"拦截一切，未登录→重定向到login.jsp→login.jsp又被拦截→重定向死循环（浏览器报"重定向次数过多"）。</span><br>
<span class="err-fix">✅ 修复：在doFilter中加白名单，放行 /login.jsp、/login、静态资源后再调chain.doFilter()。</span></div>
</div>
<div class="err-item">
<span class="err-no">4</span>
<div><b>忘记调用 chain.doFilter() 请求卡住</b><br>
<span class="err-why">原因：doFilter里只写了业务逻辑忘了放行，浏览器一直转圈、空白。</span><br>
<span class="err-fix">✅ 修复：判断通过后必须调用 <code>chain.doFilter(request,response)</code>，否则请求到不了Servlet。</span></div>
</div>
<div class="err-item">
<span class="err-no">5</span>
<div><b>doPost/doGet方法签名写错（参数用ServletRequest）</b><br>
<span class="err-why">原因：把参数写成ServletRequest/ServletResponse，这不是重写父类方法而是重载，Tomcat不会回调，访问返回405。</span><br>
<span class="err-fix">✅ 修复：参数用 <code>HttpServletRequest req, HttpServletResponse resp</code>，加 @Override 注解让编译器检查。</span></div>
</div>
<div class="err-item">
<span class="err-no">6</span>
<div><b>setCharacterEncoding 在 getParameter 之后调用</b><br>
<span class="err-why">原因：Tomcat已经用ISO-8859-1解析过参数，之后再设置编码不生效，POST中文乱码。</span><br>
<span class="err-fix">✅ 修复：在任何 getParameter 之前调用 setCharacterEncoding("UTF-8")；更简单的是用EncodingFilter统一处理。</span></div>
</div>
<div class="err-item">
<span class="err-no">7</span>
<div><b>重定向后忘记return，后续代码继续执行</b><br>
<span class="err-why">原因：sendRedirect/forward之后代码还会继续执行，可能再次响应导致IllegalStateException或业务逻辑错乱。</span><br>
<span class="err-fix">✅ 修复：sendRedirect/forward后立即 <code>return;</code> 结束方法。</span></div>
</div>
<div class="err-item">
<span class="err-no">8</span>
<div><b>把后台JSP放在webapp根目录导致可绕过登录直接访问</b><br>
<span class="err-why">原因：用户直接输入 http://xxx/admin/index.jsp 访问后台，Filter没有拦截JSP路径或JSP放在webapp下可直接访问。</span><br>
<span class="err-fix">✅ 修复：所有后台页面放入 <b>WEB-INF</b> 目录，必须通过Servlet转发才能访问。</span></div>
</div>
</div>
</script>

<script type="text/html" id="tpl-summary">
<h3>📚 本次课知识点小结</h3>
<p>本次课我们完成了书城后台管理系统 servlet-bookadmin 的登录+后台首页+过滤器+监听器，共掌握 15 个核心知识点：</p>

<div class="summary-grid">
<div class="sum-card">
<h4>🔖 Servlet 注解配置</h4>
<ul>
<li><b>@WebServlet</b>：替代web.xml注册Servlet，路径必须以/开头；4种路径匹配规则（精确/路径/扩展名/默认）</li>
<li><b>doGet/doPost</b>：处理GET/POST请求的回调方法；表单POST提交走doPost，地址栏访问走doGet</li>
<li><b>loadOnStartup</b>：≥0让Servlet随Tomcat启动时创建（默认-1首次访问才创建）</li>
</ul>
</div>

<div class="sum-card">
<h4>📥 请求与响应</h4>
<ul>
<li><b>getParameter</b>：获取请求参数（GET/POST都能用），getParameterValues取多选值</li>
<li><b>setCharacterEncoding</b>：POST请求编码必须在getParameter前调用</li>
<li><b>sendRedirect</b>：重定向（302，浏览器新请求，地址栏变，request域丢失，可跳外部）</li>
<li><b>forward</b>：服务器内部转发（一次请求，地址栏不变，request域共享，可访问WEB-INF）</li>
</ul>
</div>

<div class="sum-card">
<h4>💾 会话与域对象</h4>
<ul>
<li><b>HttpSession</b>：getSession()获取，setAttribute存数据，getAttribute取值，invalidate销毁；基于JSESSIONID Cookie识别用户</li>
<li><b>setAttribute</b>：四大域对象通用存值方法（page/request/session/application）</li>
<li><b>ServletContext</b>：全局唯一，服务器启动创建、关闭销毁，存全局共享数据</li>
</ul>
</div>

<div class="sum-card">
<h4>🔧 Filter 过滤器（核心重点）</h4>
<ul>
<li><b>Filter接口</b>：init/doFilter/destroy三方法；doFilter前后分别是前处理/后处理</li>
<li><b>@WebFilter</b>：注解注册，urlPatterns="/*"全局拦截；执行顺序按<b>类名字典序</b></li>
<li><b>chain.doFilter</b>：放行开关，调用前是请求预处理，调用后是响应后处理；U型执行</li>
<li><b>FilterConfig</b>：init参数对象，getInitParameter读取配置</li>
<li>三大经典Filter：EncodingFilter（编码）、LoginFilter（登录校验）、LogFilter（日志）</li>
</ul>
</div>

<div class="sum-card">
<h4>👂 Listener 监听器</h4>
<ul>
<li><b>8个监听器接口</b>：3类——生命周期、属性变化、对象状态</li>
<li><b>@WebListener</b>：注解注册，一个类可实现多个监听器接口</li>
<li><b>ServletContextListener</b>：监听应用启动/销毁，适合做资源初始化</li>
<li><b>HttpSessionListener</b>：监听Session创建/销毁，用于在线人数统计</li>
</ul>
</div>

<div class="sum-card">
<h4>🏭 工程实践要点</h4>
<ul>
<li>后台JSP放入<b>WEB-INF</b>防直接访问，必须通过Servlet转发</li>
<li>统一编码用Filter，不要每个Servlet重复 setCharacterEncoding</li>
<li>PRG模式：增删改后Redirect，防止刷新重复提交</li>
<li>jakarta.*与javax.*不能混用，Tomcat10用jakarta</li>
<li>线程安全：ServletContext/HttpSession属性并发访问需考虑同步</li>
</ul>
</div>
</div>

<h3>📝 课后作业</h3>
<ol>

<script type="text/plain" id="src-login-servlet">
package com.example.bookadmin;
// package声明：类所属的包，必须与目录结构一致（com/example/bookadmin目录下）

import jakarta.servlet.ServletException;
// ServletException：Servlet抛出的通用异常类，service/doGet/doPost方法需要声明
import jakarta.servlet.annotation.WebServlet;
// @WebServlet注解：Servlet 3.0+提供，用来在类上声明Servlet，替代web.xml配置
import jakarta.servlet.http.HttpServlet;
// HttpServlet：HTTP协议Servlet的基类，自定义Servlet必须继承它
import jakarta.servlet.http.HttpServletRequest;
// HttpServletRequest：封装HTTP请求的对象，包含请求参数、请求头、Session等
import jakarta.servlet.http.HttpServletResponse;
// HttpServletResponse：封装HTTP响应的对象，用来输出响应、跳转等
import jakarta.servlet.http.HttpSession;
// HttpSession：服务器端会话对象，用于跨请求存储用户数据（如登录状态）

import java.io.IOException;
// IOException：输入输出异常，响应输出流写出失败时抛出

/**
 * 登录处理Servlet：接收login.jsp提交的用户名密码，验证后写入Session并跳转
 * 对应URL：/login （由@WebServlet注解声明）
 */
@WebServlet("/login")
// @WebServlet("/login")：将本Servlet映射到URL路径"/login"
// 等价于web.xml里写 <servlet><servlet-name>login</servlet-name>...<url-pattern>/login</url-pattern></servlet>
// 访问地址：http://localhost:8080/servlet-bookadmin/login
public class LoginServlet extends HttpServlet {
    // 继承HttpServlet：获得处理HTTP请求的能力，重写doGet/doPost方法即可

    /**
     * 处理POST请求（登录表单提交使用POST方法，避免密码在URL暴露）
     * @param req  请求对象（包含表单提交的username、password参数）
     * @param resp 响应对象（用于跳转或输出）
     */
    @Override
    protected void doPost(HttpServletRequest req, HttpServletResponse resp)
            throws ServletException, IOException {
        // doPost：处理HTTP POST请求，表单method="post"时由Tomcat回调
        // 两个参数：HttpServletRequest提供请求数据，HttpServletResponse回写响应

        // 知识点：request.setCharacterEncoding 设置请求参数编码，必须在第一次getParameter之前调用
        req.setCharacterEncoding("UTF-8");
        // setCharacterEncoding("UTF-8")：告诉Tomcat用UTF-8解析POST请求体
        // 必须在getParameter之前调用，否则中文参数乱码后无法纠正

        // 知识点：request.getParameter 从请求中获取表单参数
        String username = req.getParameter("username");
        // getParameter(String name)：根据表单name属性获取提交的参数值，返回String；无此参数返回null
        String password = req.getParameter("password");
        // 获取密码输入框的值（name="password"）

        // 登录校验（教学简化：固定账号admin，密码123456；实际项目应查数据库）
        if ("admin".equals(username) && "123456".equals(password)) {
            // "admin".equals(x)：字面量在前，避免x为null时空指针异常（NPE防护的标准写法）

            // 知识点：request.getSession() 获取HttpSession对象
            HttpSession session = req.getSession();
            // getSession()：获取当前用户的Session；不存在则创建新Session
            // 底层通过Cookie中的JSESSIONID识别用户，每个浏览器独占一个Session

            // 知识点：session.setAttribute 往会话域中存入用户数据
            session.setAttribute("loginUser", username);
            // setAttribute(String name, Object value)：以键值对形式往Session域存数据
            // 存进去的数据在本次会话的所有请求中都能取到（直到Session过期或invalidate）

            // 知识点：response.sendRedirect 重定向跳转
            resp.sendRedirect(req.getContextPath() + "/index");
            // sendRedirect(String location)：告诉浏览器去请求新地址，地址栏会变化
            // getContextPath()：获取项目部署名（如"/servlet-bookadmin"），避免硬编码路径
            // 重定向后浏览器地址栏变为 /servlet-bookadmin/index，发起新的GET请求
        } else {
            // 登录失败：用request域存错误提示，转发回登录页显示
            req.setAttribute("errorMsg", "用户名或密码错误，请重新输入！");
            // setAttribute：把错误信息存到request域中，转发的目标页面可通过getAttribute取出

            // 知识点：request.getRequestDispatcher().forward() 服务器内部转发
            req.getRequestDispatcher("/login.jsp").forward(req, resp);
            // forward(request, response)：服务器内部把请求转发到login.jsp
            // 浏览器地址栏不变，请求对象共享（所以login.jsp能取出errorMsg）
            // 路径以/开头代表应用根目录（webapp根）
        }
    }

    /**
     * 处理GET请求：如果用户直接在地址栏访问/login（GET方式），直接重定向回登录页
     */
    @Override
    protected void doGet(HttpServletRequest req, HttpServletResponse resp)
            throws ServletException, IOException {
        // doGet：处理HTTP GET请求（如浏览器地址栏直接访问、<a href>链接）
        resp.sendRedirect(req.getContextPath() + "/login.jsp");
        // 直接访问/login的GET请求一律重定向回登录表单页
    }
}
</script>

<script type="text/plain" id="src-index-servlet">
package com.example.bookadmin;
// package声明：与目录结构一致 com/example/bookadmin/IndexServlet.java

import jakarta.servlet.ServletException;
import jakarta.servlet.annotation.WebServlet;
import jakarta.servlet.http.HttpServlet;
import jakarta.servlet.http.HttpServletRequest;
import jakarta.servlet.http.HttpServletResponse;
import jakarta.servlet.http.HttpSession;

import java.io.IOException;

/**
 * 后台首页Servlet：从Session读取登录用户信息，转发到admin/index.jsp展示
 * 对应URL：/index，需要登录后才能访问（过滤器会校验）
 */
@WebServlet("/index")
// @WebServlet("/index")：映射到/index路径，作为登录成功后的首页入口
public class IndexServlet extends HttpServlet {

    @Override
    protected void doGet(HttpServletRequest req, HttpServletResponse resp)
            throws ServletException, IOException {
        // doGet：首页展示用GET方法访问

        // 知识点：session.getAttribute 从会话域取出数据
        HttpSession session = req.getSession();
        String loginUser = (String) session.getAttribute("loginUser");
        // getAttribute(String name)：取出Session中之前存的数据，返回Object，需强转
        // 如果这个name从来没set过，返回null（过滤器LoginFilter正是据此判断是否登录）

        // 准备欢迎语数据，通过request域传给JSP
        req.setAttribute("welcome", "欢迎回来，" + loginUser + "！今天也要好好敲代码哦～");
        // setAttribute：把数据放到request域，forward转发后JSP通过request.getAttribute("welcome")取
        // 这是Servlet（控制器）向JSP（视图）传数据的标准方式：控制器准备数据→forward→视图渲染

        // 模拟图书列表数据（实际项目从数据库查询，教学演示直接构造）
        java.util.List<String> bookList = new java.util.ArrayList<>();
        bookList.add("《Java Web应用开发》");
        bookList.add("《Spring Boot实战》");
        bookList.add("《深入理解Java虚拟机》");
        bookList.add("《数据结构与算法分析》");
        req.setAttribute("bookList", bookList);
        // 把集合对象放到request域，JSP用EL表达式 ${bookList} 或JSTL遍历渲染

        // 知识点：服务器内部转发到WEB-INF下的JSP页面
        req.getRequestDispatcher("/WEB-INF/admin/index.jsp").forward(req, resp);
        // WEB-INF目录下的文件浏览器无法直接访问（防直接访问后台），必须通过Servlet转发
        // 这是保护后台页面的标准做法：所有访问都走Servlet/Filter，转发到WEB-INF内部页面
    }
}
</script>

<script type="text/plain" id="src-login-jsp">
<%@ page contentType="text/html;charset=UTF-8" language="java" %>
<%--
  知识点：page指令contentType属性，设置响应MIME类型和字符集
  必须写text/html;charset=UTF-8，否则浏览器解析HTML时中文会乱码
--%>
<html>
<head>
    <meta charset="UTF-8">
    <title>书城后台管理系统 - 登录</title>
    <style>
        body{font-family:"Microsoft YaHei",sans-serif;margin:0;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;align-items:center;justify-content:center;}
        .login-box{background:white;padding:40px 50px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.2);width:360px;}
        .login-box h2{margin:0 0 25px;text-align:center;color:#333;}
        .form-item{margin-bottom:18px;}
        .form-item label{display:block;font-size:13px;color:#555;margin-bottom:6px;}
        .form-item input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;}
        .form-item input:focus{outline:none;border-color:#667eea;}
        .btn{width:100%;padding:11px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:6px;font-size:15px;cursor:pointer;margin-top:5px;}
        .btn:hover{opacity:0.9;}
        .error{color:#e74c3c;text-align:center;font-size:13px;margin-bottom:15px;padding:8px;background:#fdecea;border-radius:4px;}
        .tip{text-align:center;margin-top:15px;font-size:12px;color:#999;}
    </style>
</head>
<body>

<div class="login-box">
    <h2>📚 书城后台管理系统</h2>

    <%--
      知识点：request.getAttribute 从request域取出转发过来的数据
      EL表达式 ${errorMsg} 等价于 <%= request.getAttribute("errorMsg")==null?"":request.getAttribute("errorMsg") %>
      只有登录失败转发回来时errorMsg才有值，首次打开登录页为null，不显示
    --%>
    <c:if test="${not empty errorMsg}">
    <div class="error">${errorMsg}</div>
    </c:if>
    <%  // 用JSP脚本判断更直观（教学演示）；企业开发推荐用JSTL
        String errorMsg = (String) request.getAttribute("errorMsg");
        if (errorMsg != null) {
    %>
    <div class="error"><%= errorMsg %></div>
    <% } %>

    <%--
      知识点：HTML表单form标签，action指定提交目标，method指定请求方法
      action="login"：提交到 /servlet-bookadmin/login（即LoginServlet处理）
      method="post"：使用POST方法，表单数据放在请求体中，不出现在URL上，更安全（密码不暴露）
    --%>
    <form action="login" method="post">
        <div class="form-item">
            <label>用户名</label>
            <%-- input标签name属性是getParameter的键，必须写对大小写，否则后端拿不到值 --%>
            <input type="text" name="username" placeholder="请输入用户名（admin）" required>
        </div>
        <div class="form-item">
            <label>密码</label>
            <%-- type="password"：浏览器会以圆点显示输入内容，防止肩窥 --%>
            <input type="password" name="password" placeholder="请输入密码（123456）" required>
        </div>
        <button class="btn" type="submit">登 录</button>
    </form>

    <div class="tip">测试账号：admin / 123456</div>
</div>

<script type="text/plain" id="src-login-filter">
package com.example.bookadmin.filter;
// package：过滤器统一放在filter子包下，与Servlet、Listener分包管理

import jakarta.servlet.*;
// Filter：过滤器接口，所有过滤器必须实现此接口
// FilterChain：过滤器链对象，调用chain.doFilter()将请求传给下一个过滤器或目标资源
// FilterConfig：过滤器配置对象，可获取初始化参数、ServletContext等
import jakarta.servlet.annotation.WebFilter;
// @WebFilter：过滤器注解，Servlet 3.0+，用于声明过滤器与拦截路径
import jakarta.servlet.http.HttpFilter;
import jakarta.servlet.http.HttpServletRequest;
import jakarta.servlet.http.HttpServletResponse;
import jakarta.servlet.http.HttpSession;

import java.io.IOException;

/**
 * 登录校验过滤器：拦截所有需要登录才能访问的后台请求
 * 未登录（Session中没有loginUser）时一律重定向回登录页
 */
@WebFilter(filterName = "loginFilter", urlPatterns = {"/index", "/admin/*", "*.do"})
// @WebFilter：声明这是一个过滤器
// urlPatterns：要拦截的URL路径，支持数组多路径；这里拦截/index、/admin下所有、所有.do结尾请求
// 注意：/login 和 /login.jsp 不能拦截，否则会重定向死循环
public class LoginFilter implements Filter {
    // 实现Filter接口：必须重写init、doFilter、destroy三个方法
    // 也可以继承HttpFilter抽象类（GenericFilter的HTTP子类），更简洁

    @Override
    public void init(FilterConfig filterConfig) throws ServletException {
        // init：过滤器初始化方法，服务器启动时执行一次，用于加载配置、初始化资源
        System.out.println("[LoginFilter] 登录校验过滤器已初始化");
    }

    @Override
    public void doFilter(ServletRequest request, ServletResponse response, FilterChain chain)
            throws IOException, ServletException {
        // doFilter：核心过滤方法，每次请求匹配urlPatterns时都会执行
        // 参数ServletRequest/Response是通用父类，处理HTTP需强转为HttpServletRequest/Response

        HttpServletRequest req = (HttpServletRequest) request;
        HttpServletResponse resp = (HttpServletResponse) response;

        // 设置请求编码（EncodingFilter会处理，但单个过滤器独立运行时需注意顺序）
        req.setCharacterEncoding("UTF-8");

        // 获取请求路径，判断是否需要放行（登录相关路径直接放行）
        String uri = req.getRequestURI();
        // getRequestURI()：获取请求的URI部分（不含域名、参数），如 /servlet-bookadmin/login

        // 登录页、登录请求、静态资源直接放行，不校验登录
        if (uri.endsWith("/login.jsp") || uri.endsWith("/login")
                || uri.contains("/static/") || uri.endsWith(".css") || uri.endsWith(".js")) {
            // chain.doFilter()：放行，将请求传给过滤器链的下一个节点（下一个Filter或目标Servlet/JSP）
            chain.doFilter(request, response);
            return;
        }

        // 核心逻辑：从Session判断是否登录
        HttpSession session = req.getSession();
        Object loginUser = session.getAttribute("loginUser");
        // loginUser不为null表示已登录，null表示未登录
        if (loginUser != null) {
            // 已登录：放行
            chain.doFilter(request, response);
        } else {
            // 未登录：重定向到登录页
            resp.sendRedirect(req.getContextPath() + "/login.jsp");
            // 注意：重定向后不要继续调用chain.doFilter()，也不要写其他响应
        }
    }

    @Override
    public void destroy() {
        // destroy：过滤器销毁方法，服务器关闭或应用卸载时执行一次，用于释放资源
        System.out.println("[LoginFilter] 登录校验过滤器已销毁");
    }
}
</script>

<script type="text/plain" id="src-encoding-filter">
package com.example.bookadmin.filter;
// package：filter子包

import jakarta.servlet.*;
import jakarta.servlet.annotation.WebFilter;
import jakarta.servlet.http.HttpServletRequest;
import java.io.IOException;

/**
 * 统一编码过滤器：拦截所有请求（/*），在所有业务代码执行前设置请求与响应的字符编码为UTF-8
 * 解决中文乱码问题——企业项目必备组件，避免每个Servlet都手动写setCharacterEncoding
 */
@WebFilter(filterName = "encodingFilter", urlPatterns = "/*")
// urlPatterns = "/*"：拦截所有请求（包括静态资源、JSP、Servlet），是"全局过滤器"的标准写法
// 执行顺序：按类名的字典序排序，EncodingFilter < LoginFilter < LogFilter，所以编码最先执行
public class EncodingFilter implements Filter {

    private String encoding = "UTF-8";
    // encoding：字符编码，可通过FilterConfig从web.xml初始化参数读取，教学默认UTF-8

    @Override
    public void init(FilterConfig filterConfig) throws ServletException {
        // init：读取初始化参数（如果web.xml中配置了<init-param>）
        String enc = filterConfig.getInitParameter("encoding");
        if (enc != null && !enc.isEmpty()) {
            this.encoding = enc;
        }
        System.out.println("[EncodingFilter] 编码过滤器初始化完成，编码=" + encoding);
    }

    @Override
    public void doFilter(ServletRequest request, ServletResponse response, FilterChain chain)
            throws IOException, ServletException {
        // 知识点：统一设置请求和响应的字符编码为UTF-8
        request.setCharacterEncoding(encoding);
        // setCharacterEncoding：设置请求体的解析编码，对POST请求体生效，必须在getParameter前调用
        response.setCharacterEncoding(encoding);
        // setCharacterEncoding：设置响应字符编码，等价于response.setContentType("text/html;charset=UTF-8")中的编码部分
        response.setContentType("text/html;charset=" + encoding);
        // setContentType：同时设置MIME类型和字符集，确保浏览器用UTF-8解码响应

        // 放行：编码设置完后必须调用chain.doFilter()，否则请求不会到达后端
        chain.doFilter(request, response);
        // 知识点：过滤器链chain.doFilter()
        // 调用chain.doFilter(request,response)前的代码 = 请求到达目标资源<b>之前</b>执行
        // chain.doFilter()之后的代码 = 目标资源处理完成、响应回来<b>之后</b>执行
        // 这是Filter能做"前后夹击"处理的基础
    }

    @Override
    public void destroy() {
        System.out.println("[EncodingFilter] 编码过滤器已销毁");
    }
}
</script>

<script type="text/plain" id="src-log-filter">
package com.example.bookadmin.filter;

import jakarta.servlet.*;
import jakarta.servlet.annotation.WebFilter;
import jakarta.servlet.http.HttpServletRequest;
import java.io.IOException;
import java.text.SimpleDateFormat;
import java.util.Date;

/**
 * 请求日志过滤器：拦截所有请求，在服务器控制台打印访问日志
 * 演示Filter"前处理+后处理"的特性：chain.doFilter之前记录开始时间，之后计算耗时
 */
@WebFilter(filterName = "logFilter", urlPatterns = "/*")
public class LogFilter implements Filter {

    @Override
    public void init(FilterConfig filterConfig) throws ServletException {
        System.out.println("[LogFilter] 请求日志过滤器已启动");
    }

    @Override
    public void doFilter(ServletRequest request, ServletResponse response, FilterChain chain)
            throws IOException, ServletException {
        HttpServletRequest req = (HttpServletRequest) request;

        // ------- 前处理：请求到达目标资源前执行 -------
        long startTime = System.currentTimeMillis();
        // System.currentTimeMillis()：记录请求开始时间（毫秒时间戳），用于计算耗时
        String uri = req.getRequestURI();
        String method = req.getMethod();
        String ip = request.getRemoteAddr();
        // getRemoteAddr()：获取客户端IP地址
        String time = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss").format(new Date());

        System.out.println("[LogFilter] [" + time + "] " + ip + " " + method + " " + uri + " 开始处理");

        // 放行：让请求继续走过滤器链，最终到达Servlet/JSP
        chain.doFilter(request, response);
        // ======== 执行到这里时，目标资源已经处理完毕，响应已经写回 ========

        // ------- 后处理：目标资源处理完成后执行 -------
        long endTime = System.currentTimeMillis();
        long cost = endTime - startTime;
        // 计算请求处理耗时（毫秒），用于性能监控
        System.out.println("[LogFilter] [" + time + "] " + uri + " 处理完成，耗时 " + cost + " ms");
    }

    @Override
    public void destroy() {
        System.out.println("[LogFilter] 请求日志过滤器已销毁");
    }
}
</script>

<script type="text/plain" id="src-context-listener">
package com.example.bookadmin.listener;
// package：监听器统一放在listener子包下

import jakarta.servlet.ServletContext;
// ServletContext：Servlet上下文对象（即JSP内置对象application），整个Web应用全局共享
import jakarta.servlet.ServletContextEvent;
// ServletContextEvent：上下文生命周期事件对象，可从中获取ServletContext
import jakarta.servlet.ServletContextListener;
// ServletContextListener：上下文生命周期监听器接口，监听Web应用启动和销毁事件
import jakarta.servlet.annotation.WebListener;
// @WebListener：监听器注解，Servlet 3.0+，标记该类为监听器，启动时自动注册
import jakarta.servlet.http.HttpSessionEvent;
// HttpSessionEvent：Session生命周期事件对象
import jakarta.servlet.http.HttpSessionListener;
// HttpSessionListener：Session生命周期监听器，监听Session创建和销毁

/**
 * 应用上下文监听器：
 * ① contextInitialized：服务器启动（Web应用部署）时执行一次，用于初始化全局数据
 * ② contextDestroyed：服务器关闭（应用卸载）时执行一次，用于释放资源
 * ③ sessionCreated/sessionDestroyed：监听Session创建/销毁，实现在线人数统计
 */
@WebListener
// @WebListener：无需额外配置，Tomcat启动时自动扫描并注册这个监听器
public class AppContextListener implements ServletContextListener, HttpSessionListener {
    // 一个类可以同时实现多个监听器接口，同时监听多种事件

    @Override
    public void contextInitialized(ServletContextEvent sce) {
        // contextInitialized：Web应用初始化完成时被调用（服务器启动时执行一次）
        // 常用于：初始化全局数据、加载配置文件、创建数据库连接池、启动定时任务等

        ServletContext application = sce.getServletContext();
        // getServletContext()：获取全局的ServletContext对象（application内置对象）
        // 整个Web应用只有一个ServletContext，所有Servlet/JSP/Filter共享

        // 初始化在线人数计数器，存到ServletContext全局域
        application.setAttribute("onlineCount", 0);
        // ServletContext域的属性：整个应用生命周期内有效，所有用户共享
        // 这里初始化为0，后面有新Session创建就+1，Session销毁就-1，实现简单在线人数统计

        // 可以读取初始化参数（web.xml中<context-param>配置）
        String appName = application.getInitParameter("appName");

        System.out.println("========================================");
        System.out.println("[AppContextListener] 书城后台管理系统启动！");
        System.out.println("[AppContextListener] ServletContext已初始化，在线人数计数器已置0");
        System.out.println("========================================");
    }

    @Override
    public void contextDestroyed(ServletContextEvent sce) {
        // contextDestroyed：Web应用销毁时调用（服务器关闭或应用卸载）
        // 常用于：关闭数据库连接池、停止定时任务、保存数据到磁盘等清理工作
        System.out.println("[AppContextListener] 书城后台管理系统已关闭，释放资源");
    }

    @Override
    public void sessionCreated(HttpSessionEvent se) {
        // sessionCreated：新Session创建时调用（新用户首次访问服务器时触发）
        ServletContext application = se.getSession().getServletContext();
        // 通过SessionEvent获取Session，再获取全局ServletContext
        Integer count = (Integer) application.getAttribute("onlineCount");
        if (count == null) count = 0;
        application.setAttribute("onlineCount", count + 1);
        // 在线人数+1：线程安全问题在生产环境需加锁或用AtomicInteger，教学演示简化处理
        System.out.println("[AppContextListener] 新用户访问，当前在线人数：" + (count + 1));
    }

    @Override
    public void sessionDestroyed(HttpSessionEvent se) {
        // sessionDestroyed：Session销毁时调用（Session过期或调用session.invalidate()）
        ServletContext application = se.getSession().getServletContext();
        Integer count = (Integer) application.getAttribute("onlineCount");
        if (count != null && count > 0) {
            application.setAttribute("onlineCount", count - 1);
            System.out.println("[AppContextListener] 用户离开，当前在线人数：" + (count - 1));
        }
    }
}
</script>
